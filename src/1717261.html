<script>
/* LOJABIT - visual novo 13: topo novo (logo, atendimento, favoritos, conta e sacola).
   PUBLICADO = false -> só aparece no navegador que abriu www.lojabit.com/?lbtopo=1 (desliga com ?lbtopo=0).
   PUBLICADO = true  -> aparece para todos os clientes. O código "Visual novo 14" faz a parte de montar os ícones. */
(function () {
  var PUBLICADO = true;
  var on = PUBLICADO;
  try {
    var q = location.search;
    if (/[?&]lbtopo=1(&|$)/.test(q)) localStorage.setItem('lbTopo', '1');
    if (/[?&]lbtopo=0(&|$)/.test(q)) localStorage.removeItem('lbTopo');
    if (localStorage.getItem('lbTopo') === '1') on = true;
  } catch (e) {}
  if (on) document.documentElement.className += ' lbtopo';
})();
</script>
