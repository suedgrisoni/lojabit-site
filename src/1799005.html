<script>
/* LOJABIT - Relógios: carrega dist/rel.css e dist/rel.js (código 1799004) do mesmo commit do rod.js, SÓ onde há relógio:
   - na página de um relógio (título começa com "Relógio");
   - nas listagens (categoria, marca, busca) que têm cartão de relógio.
   As outras páginas (perfumes etc.) não baixam nada a mais. (13/11/2026; publicado para todos no mesmo dia)
   ?lbrel=0 desliga só neste navegador (para comparar); ?lbrel=1 liga de novo. */
(function () {
  'use strict';
  var PUBLICADO = true;
  var RELV = '__REL_V__'; /* trocado pelo build.py: muda sempre que rel.css/rel.js mudam */
  var on = PUBLICADO;
  try {
    if (/[?&]lbrel=1(&|$)/.test(location.search)) localStorage.removeItem('lbRelOff');
    if (/[?&]lbrel=0(&|$)/.test(location.search)) localStorage.setItem('lbRelOff', '1');
    if (localStorage.getItem('lbRelOff') === '1') on = false;
  } catch (e) {}
  if (!on) return;
  var me = (document.currentScript && document.currentScript.src) || '';
  var base = /\/dist\/rod\.js/.test(me) ? me.replace(/rod\.js.*$/, '') : '';
  if (!base) return;
  function carrega() {
    if (window.__lbRelC) return;
    window.__lbRelC = 1;
    var l = document.createElement('link');
    l.rel = 'stylesheet'; l.href = base + 'rel.css?v=' + RELV; l.crossOrigin = 'anonymous';
    l.onerror = function () { this.onerror = null; this.href = this.href.replace('//cdn.', '//fastly.'); };
    document.head.appendChild(l);
    var s = document.createElement('script');
    s.src = base + 'rel.js?v=' + RELV; s.crossOrigin = 'anonymous';
    s.onerror = function () { var t = document.createElement('script'); t.src = s.src.replace('//cdn.', '//fastly.'); document.head.appendChild(t); };
    document.head.appendChild(s);
  }
  var REL = /^\s*Rel[óo]gio/i;
  function vai() {
    if (window.__lbRelC) return;
    var bc = document.body.className;
    if (/\bpagina-produto\b/.test(bc)) {
      var h = document.querySelector('h1.nome-produto');
      if (h && REL.test(h.textContent)) carrega();
      return;
    }
    if (!/\bpagina-(categoria|marca|busca)\b/.test(bc)) return;
    var a = document.querySelectorAll('.listagem-item a.produto-sobrepor[title], .lbx-card .lbx-nome');
    for (var i = 0; i < a.length; i++) if (REL.test(a[i].getAttribute('title') || a[i].textContent)) { carrega(); return; }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', vai); else vai();
  window.addEventListener('load', vai);
})();
</script>
