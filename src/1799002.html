<!-- LOJABIT - Promoção de decants (3 = 5%, 6 = 10%, 9 = 15%) + faixa de confiança de volta (12/11/2026).
     Só no repositório. PUBLICADO desde 12/11/2026 (promoção DECANTS_3_6_9 ligada no painel). Com PUBLICADO=false
     volta a ser prévia: só aparece para quem abre o site com ?lbpromo=1 (e some com ?lbpromo=0).
     Peças: (1) faixa de confiança nas páginas internas (no celular vira fileira de selos que desliza);
            (2) faixa da promoção na home (computador: entre a abertura e "A casa"; celular: logo abaixo do cartão preto);
            (3) cartão da promoção no topo de /decants; (4) quadro "Leve mais, pague menos" no produto, abaixo do "Quanto rende";
            (5) barra de progresso na sacola; (6) duas frases novas na faixa preta do topo; (7) linha extra no aviso "foi para a sacola".
     A contagem lê a sacola (/carrinho/minicart): soma a quantidade dos decants (SKU terminado em -3ml/-5ml/-10ml/-30ml)
     que estão na categoria escondida da promoção (24495076, filha da inativa 977544). Quem fica fora: EXCL (7 perfumes cujo
     frasco daria prejuízo com 15% + Pix). Perfume novo com decant precisa entrar na categoria 24495076 para valer a promoção. -->
<style>

.lbpd-k{display:block;font:500 10.5px/1.3 var(--lb-sans,Jost,Arial,sans-serif);letter-spacing:.22em;text-transform:uppercase;color:var(--lb-gold-text,#8F6E2E)}

/* (2) home — computador */

.lbpd-sac p{margin:0 0 9px!important;font-size:14px!important;line-height:1.4!important;color:var(--lb-body,#403A34)!important}
.lbpd-sac p b{font-weight:600;color:var(--lb-ink,#0A0A0B)}
.lbpd-bar{position:relative;height:5px;margin:0 6px 19px 0;border-radius:3px;background:var(--lb-line,#ECE5DA)}
.lbpd-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--lb-gold,#C9A55C);transition:width .4s}

small.lbpd-av{display:block;margin-top:3px;color:var(--lb-gold,#C9A55C)!important;font-weight:500}
</style>
<script>

  if (!ligado || window.__lbpd) return;

  var FAIXAS = [[3, 5], [6, 10], [9, 15]];
  var CAT = '24495076';                 /* categoria escondida "Promoção Decants (uso interno, não apagar)" */
  /* fora da promoção (o frasco daria prejuízo com 15% + Pix): Chanel Chance Eau Tendre, Bvlgari Man In Black,
     Chanel Chance Eau Fraîche, French Avenue Spectre Ghost, Polo Black, Chanel Chance EDP, CH Cedar Chic */
  var EXCL = { '35021295': 1, '19254482': 1, '351474067': 1, '334121425': 1, '8623615': 1, '15746440': 1, '403336099': 1 };

  var H = document.documentElement, B = document.body;
  H.classList.add('lbpd-on');
  var mob = function () { return H.classList.contains('lbmob'); };
  var pg = (B && B.className) || '';
  var HOME = /\bpagina-inicial\b/.test(pg), PROD = /\bpagina-produto\b/.test(pg), SAC = /\bpagina-carrinho\b/.test(pg);
  var LISTA = /\bpagina-(categoria|busca|marca)\b/.test(pg);
  var DECANTS = /\bcategoria-22896349\b/.test(pg) || /^\/decants\/?$/.test(location.pathname);
  var pidM = pg.match(/\bproduto-(\d+)\b/), PID = pidM ? pidM[1] : '';

  function el(html) { var d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }
  function plural(n, s, p) { return n + ' ' + (n === 1 ? s : p); }
  function faixa(n) { var f = null; for (var i = 0; i < FAIXAS.length; i++) if (n >= FAIXAS[i][0]) f = FAIXAS[i]; return f; }
  function prox(n) { for (var i = 0; i < FAIXAS.length; i++) if (n < FAIXAS[i][0]) return FAIXAS[i]; return null; }
  function tiersHtml(cls, n) {
    return '<ol class="lbpd-tiers' + (cls ? ' ' + cls : '') + '">' + FAIXAS.map(function (f) {

  }

  /* sacola: quantos decants da promoção já tem */
  var cache = null, cacheT = 0, mexeu = false;   /* mexeu: a sacola mudou nesta página (o .vazio do topo não se atualiza sozinho) */
  function conta(forca) {

    var cab = document.querySelector('#cabecalho .carrinho');

    if (!forca && cache && Date.now() - cacheT < 1500) return cache;

    cache = fetch('/carrinho/minicart', { credentials: 'same-origin', headers: { 'X-Requested-With': 'XMLHttpRequest' } })
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (j) {

  var ICO = {

  };

  /* (1) faixa de confiança nas páginas internas */
  function faixaConfianca() {
    if (HOME || (mob() && SAC) || document.querySelector('.lbtc')) return true;
    var corpo = document.getElementById('corpo');
    if (!corpo || !corpo.parentNode) return false;
    var itens = [
      '<a class="lbtc-i" href="' + MAPA + '" target="_blank" rel="noopener">' + ICO.google + '<span><b><data data-lbnota>' + NOTA + '</data> no Google</b><small> · <data data-lbav>' + AVAL + '</data> avaliações</small></span></a>',

     que sobe e desce ao rolar. Só lê uma posição por quadro (requestAnimationFrame). */
  function prende(tc) {
    var cab = document.getElementById('cabecalho'), menu = document.querySelector('.main-menu-desktop');
    var ultT = -1, ultH = -1, pend = 0, fim = 0;

    }
    function calc() {
      pend = 0;
      /* o menu do computador é refeito por outro código depois que a página abre: busca de novo se o guardado saiu da página */
      if (!cab || !cab.isConnected) cab = document.getElementById('cabecalho');
      if (!menu || !menu.isConnected) menu = document.querySelector('.main-menu-desktop');
      var t = Math.max(0, base(cab), mob() ? 0 : base(menu));
      if (t !== ultT) { ultT = t; tc.style.setProperty('--lbtc-top', t + 'px'); }
      var h = tc.offsetHeight;
      if (h !== ultH) { ultH = h; H.style.setProperty('--lbtc-h', h + 'px'); }
    }
    function pede() { if (!pend) pend = requestAnimationFrame(calc); }
    /* o topo encolhe/aparece com animação depois da rolagem: confere de novo quando a rolagem para */
    function rolou() { pede(); clearTimeout(fim); fim = setTimeout(function () { pede(); setTimeout(pede, 350); }, 160); }
    calc();
    window.addEventListener('scroll', rolou, { passive: true });
    window.addEventListener('resize', rolou, { passive: true });
    document.addEventListener('transitionend', function (e) { var x = e.target; if (x && (x.id === 'cabecalho' || (x.classList && x.classList.contains('main-menu-desktop')))) pede(); }, true);
    setTimeout(pede, 800); setTimeout(pede, 2500);
  }

  /* nota e número de avaliações do Google: vêm sozinhos do robô (mesma fonte da home); o número escrito é só reserva */
  function notaGoogle() {
    if (window.__lbAval) return window.__lbAval();
    var g = window.__lbx && window.__lbx.avG;
    if (!g) { try { var t = JSON.parse(localStorage.getItem('lbVitrine1') || 'null'); g = t && t.d && t.d.google; } catch (e) {} }
    if (!g || !g.total) return false;
    var tot = String(g.total).replace(/\B(?=(\d{3})+(?!\d))/g, '.'), nota = Number(g.nota || 4.9).toFixed(1).replace('.', ',');
    [].forEach.call(document.querySelectorAll('[data-lbav]'), function (e) { if (e.textContent !== tot) e.textContent = tot; });
    [].forEach.call(document.querySelectorAll('[data-lbnota]'), function (e) { if (e.textContent !== nota) e.textContent = nota; });
    return true;
  }

  /* (2) home */
  var TIT = 'Quanto mais decants, <em>maior o desconto</em>';
  var SUB = 'Misture árabes, nichos e importados, em 5, 10 ou 30 ml. O desconto aparece sozinho na sacola.';
  function fine() { return (SOMA_PIX ? 'Soma com os 10% do Pix. ' : '') + 'Quase todos os decants participam; os poucos que ficam fora avisam na página do perfume.'; }
  function home() {
    if (!HOME || document.querySelector('.lbpd-home,.lbpd-mh')) return true;
    if (mob()) {
      var hero = document.querySelector('#lbxTopo .lbx-hero');
      if (!hero) return false;
      hero.parentNode.insertBefore(el('<a class="lbpd-mh" href="/decants"><div class="lbpd-mh-t"><span class="lbpd-k">Promoção de decants</span><i>Ver decants ›</i></div><h3>Leve mais, <em>pague menos</em></h3>' + tiersHtml('') + '<p>Misture perfumes e tamanhos. O desconto aparece sozinho na sacola.</p></a>'), hero.nextSibling);
      return true;
    }
    var abre = document.querySelector('section.lbq .lbq-abre');
    if (!abre) return false;
    abre.parentNode.insertBefore(el('<div class="lbpd-home"><div class="lbpd-home-in"><div><span class="lbpd-k">Decants · leve mais, pague menos</span><h2>' + TIT + '</h2><p>' + SUB + '</p></div>' + tiersHtml('') + '<div><a class="lbpd-cta" href="/decants">Escolher decants</a><p class="lbpd-fine">' + fine() + '</p></div></div></div>'), abre.nextSibling);
    return true;
  }

  /* (3) topo de /decants */
  function decants() {
    if (!DECANTS || document.querySelector('.lbpd-dc')) return true;
    var alvo = document.querySelector('.conteudo .lbpq-faixa') || document.querySelector('.conteudo section.lbdi') || document.querySelector('section.lbdi');
    if (!alvo) return false;
    alvo.parentNode.insertBefore(el('<section class="lbpd-dc"><div><span class="lbpd-k">Leve mais, pague menos</span><h2>' + TIT + '</h2><p>' + SUB + '</p><p class="lbpd-fine">' + fine() + '</p></div>' + tiersHtml('') + '</section>'), alvo);
    return true;
  }

  /* (4) produto */
  function msgProduto(st) {
    if (!st || !st.n) return 'Misture perfumes e tamanhos. O desconto aparece sozinho na sacola.';
    var f = faixa(st.n), p = prox(st.n);
    var tem = 'Você já tem <b>' + plural(st.n, 'decant', 'decants') + '</b> na sacola';
    if (!f) return tem + '. Mais <b>' + (p[0] - st.n) + '</b> e você ganha <b>' + p[1] + '% off</b>.';
    if (!p) return tem + ': <b>' + f[1] + '% off</b> garantido.';
    return tem + ': <b>' + f[1] + '% off</b> garantido. Mais ' + (p[0] - st.n) + ' para <b>' + p[1] + '%</b>.';
  }
  function produto() {
    if (!PROD) return true;
    if (document.querySelector('.lbpd-box,.lbpd-fora')) return true;
    var mini = document.querySelector('.lbdc-mini');
    if (!mini) return false;
    if (EXCL[PID]) { mini.parentNode.insertBefore(el('<p class="lbpd-fora">Este perfume não entra na promoção de decants por quantidade.</p>'), mini.nextSibling); return true; }
    var box = el('<div class="lbpd-box"><div class="lbpd-box-h"><span>Leve mais, pague menos</span><a href="/decants">Ver decants ›</a></div>' + tiersHtml('') + '<p class="lbpd-msg">' + msgProduto(null) + '</p></div>');
    mini.parentNode.insertBefore(box, mini.nextSibling);
    atualizaProduto(false);
    return true;
  }
  function atualizaProduto(forca, pronto) {
    var box = document.querySelector('.lbpd-box');
    if (!box) return;
    (pronto ? Promise.resolve(pronto) : conta(forca)).then(function (st) {
      if (!st) return;
      [].forEach.call(box.querySelectorAll('.lbpd-tiers li'), function (li) { li.classList.toggle('lbpd-ok', st.n >= +li.getAttribute('data-n')); });
      var m = box.querySelector('.lbpd-msg'), h = msgProduto(st);
      if (m && m.innerHTML !== h) m.innerHTML = h;
    });
  }

  /* (5) sacola */
  function htmlSacola(st) {
    if (!st || (!st.n && !st.fora)) return '';
    var n = st.n, f = faixa(n), p = prox(n), t;
    if (!n) t = (st.fora === 1 ? 'O decant da sua sacola não entra' : 'Os decants da sua sacola não entram') + ' na promoção por quantidade.';
    else if (!f) t = (p[0] - n === 1 ? 'Falta' : 'Faltam') + ' <b>' + plural(p[0] - n, 'decant', 'decants') + '</b> para <b>' + p[1] + '% off</b> nos decants.';
    else if (!p) t = '<b>' + f[1] + '% off</b> nos seus ' + n + ' decants. Desconto máximo garantido!';
    else t = '<b>' + f[1] + '% off</b> nos seus ' + n + ' decants. Mais ' + plural(p[0] - n, 'decant', 'decants') + ' para <b>' + p[1] + '%</b>.';
    var max = FAIXAS[FAIXAS.length - 1][0], w = Math.min(n, max) / max * 100;
    var marcas = FAIXAS.map(function (x) { return '<s style="left:' + (x[0] / max * 100).toFixed(2) + '%"' + (n >= x[0] ? ' class="lbpd-ok"' : '') + '><em>' + x[0] + ' · ' + x[1] + '%</em></s>'; }).join('');
    return '<p>' + t + '</p>' + (n ? '<div class="lbpd-bar"><i style="width:' + w.toFixed(1) + '%"></i>' + marcas + '</div>' : '') +
      (p ? '<a href="/decants">Escolher mais decants ›</a>' : '') + (n && st.fora ? '<small>' + (st.fora === 1 ? '1 decant da sacola não entra' : st.fora + ' decants da sacola não entram') + ' na promoção.</small>' : '');
  }
  var ultimoSac = null;
  function sacola(forca) {
    if (!SAC) return true;
    var fg = document.querySelector('#lbxSacola .lbx-fg') || document.querySelector('.lbk .lbk-fg');
    if (!fg) return false;
    conta(forca).then(function (st) {
      var h = htmlSacola(st), cx = document.querySelector('.lbpd-sac');
      var fg2 = document.querySelector('#lbxSacola .lbx-fg') || document.querySelector('.lbk .lbk-fg');
      if (!h) { if (cx) cx.parentNode.removeChild(cx); ultimoSac = h; return; }
      if (!cx && fg2) { cx = el('<div class="lbpd-sac" aria-live="polite"></div>'); fg2.parentNode.insertBefore(cx, fg2.nextSibling); }
      if (cx && cx.innerHTML !== h) cx.innerHTML = h;
      ultimoSac = h;
    });
    return true;
  }
  function assinatura() {
    var q = function (s) { var e = document.querySelector(s); return e ? e.textContent.replace(/\s+/g, ' ') : ''; };
    return q('#lbxSacola .lbx-sc-cab') + '|' + q('#lbxSacola .lbx-sc-rs') + '|' + q('.lbk .lbk-topo') + '|' + q('.lbk .lbk-sub') + '|' + q('.lbk .lbk-itens');
  }
  function vigiaSacola() {
    if (!SAC || !window.MutationObserver) return;
    var t = 0, ult = assinatura();
    new MutationObserver(function () {
      clearTimeout(t);
      t = setTimeout(function () { var a = assinatura(); if (a !== ult) { ult = a; sacola(true); } }, 600);
    }).observe(document.getElementById('corpo') || B, { childList: true, subtree: true, characterData: true });
  }

  /* (6) duas frases novas na faixa preta do topo */
  function topo() {
    var tr = document.querySelector('.banner-top .lbt-trilho');
    if (!tr) return false;
    if (tr.getAttribute('data-lbpd')) return true;
    var it = tr.querySelectorAll('.lbt-item'), n = it.length / 4;
    if (!n || n !== Math.floor(n)) return true;
    var tx = [].slice.call(it, 0, n).map(function (s) { return s.textContent; });
    var novos = ['Decants: leve 3, 6 ou 9 e ganhe até 15% off', '\u0001'];
    tx.splice(1, 0, novos[0]); tx.splice(3, 0, novos[1]);
    var h = tx.map(function (t) { var s = document.createElement('span'); s.className = 'lbt-item'; s.textContent = t; return s.outerHTML; }).join('')
      .replace('\u0001', '<data data-lbnota>' + NOTA + '</data> no Google · <data data-lbav>' + AVAL + '</data> avaliações');
    h = h.split('\u0001').join('<data data-lbnota>' + NOTA + '</data> no Google · <data data-lbav>' + AVAL + '</data> avaliações');
    tr.innerHTML = h + h + h + h;
    tr.style.animationDuration = Math.round(48 * tx.length / n) + 's';
    tr.setAttribute('data-lbpd', '1');
    var lb = tr.parentNode; if (lb && lb.setAttribute) lb.setAttribute('aria-label', tx.join(' · ').replace('\u0001', NOTA + ' no Google'));
    return true;
  }

  /* (7) aviso "foi para a sacola": acrescenta quantos decants faltam */
  function aviso() {
    var x = window.__lbx;
    if (!x || typeof x.aviso !== 'function') return false;
    if (x.aviso.__lbpd) return true;
    var orig = x.aviso;
    var novo = function (t) {
      orig.apply(this, arguments);
      if (!/foi para a sacola/.test(String(t))) return;
      mexeu = true;
      conta(true).then(function (st) {
        atualizaProduto(false, st);
        if (!st || !st.n) return;
        var f = faixa(st.n), p = prox(st.n), m;
        if (!f) m = 'Mais ' + plural(p[0] - st.n, 'decant', 'decants') + ' e você ganha ' + p[1] + '% off';
        else if (p) m = f[1] + '% off nos decants · mais ' + (p[0] - st.n) + ' para ' + p[1] + '%';
        else m = f[1] + '% off nos seus decants';
        var lnk = [].filter.call(document.querySelectorAll('a[href="/carrinho/index"]'), function (a) { return /Ver sacola/.test(a.textContent) && a.previousElementSibling; })[0];
        var sp = lnk && lnk.previousElementSibling;
        if (sp && !sp.querySelector('.lbpd-av')) sp.insertAdjacentHTML('beforeend', '<small class="lbpd-av">' + m + '</small>');
      });
    };
    novo.__lbpd = 1;
    x.aviso = novo;
    return true;
  }

  var tarefas = [topo, faixaConfianca, home, decants, produto, sacola, aviso, notaGoogle], feitas = {}, voltas = 0, relogio = 0;
  function roda() {
    clearTimeout(relogio);
    var falta = 0;
    tarefas.forEach(function (f, i) {
      if (feitas[i]) return;
      try { if (f()) feitas[i] = 1; else falta++; } catch (e) { feitas[i] = 1; }
    });
    if (falta && ++voltas < 30) relogio = setTimeout(roda, 350);
  }
  /* roda já (o rod.js fica no fim da página, então #corpo e o topo já existem): a faixa entra antes da 1ª pintura e a página não "pula" */
  roda();
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { voltas = 0; roda(); });
  vigiaSacola();
  window.addEventListener('pageshow', function (e) { if (e.persisted) { atualizaProduto(true); sacola(true); } });
})();
</script>
