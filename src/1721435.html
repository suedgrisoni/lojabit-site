<script>
/* LOJABIT - tamanhos e preços NA HORA nas sugestões da busca (02/11/2026, pedido do Nevander: "preços na busca demorando").
   Fonte: claude/site/velocidade/busca-tamanhos.html. Rodapé, todas as páginas exceto checkout.
   Antes, o Visual novo 18 abria a página de cada produto sugerido para mostrar 5 ml / 10 ml / 30 ml / frasco (1 a 5 s, um por um).
   Agora usa a base do robô dos filtros que o site já guarda no navegador (lbFil1, atualizada a cada 2 h): aparece junto com a sugestão.
   Conferência: o menor preço da base tem de ser igual ao preço que a sugestão mostra (índice da busca); se não for, ou se o produto
   não estiver na base, o Visual novo 18 abre a página do produto como antes. Produto sem tamanhos também segue o caminho antigo. */
(function () {
  'use strict';
  if (window.__lbS) return;
  var M = null;
  function base() {
    if (M !== null) return M;
    M = false;
    try {
      var t = +localStorage.getItem('lbFil1t') || 0, j = localStorage.getItem('lbFil1');
      if (!j || Date.now() - t > 864e5) return M;
      var d = JSON.parse(j), m = {};
      (d.p || []).forEach(function (r) { m[r[1]] = r; });
      M = m;
    } catch (e) { M = false; }
    return M;
  }
  function reais(t) {
    var m = String(t || '').replace(/\s/g, '').match(/(\d{1,3}(?:\.\d{3})*|\d+),(\d{2})/);
    return m ? +(m[1].replace(/\./g, '') + '.' + m[2]) : 0;
  }
  /* devolve {t, v} no formato do Visual novo 18: v = [[ "5 ml", preço, disponível 1/0, id do tamanho p/ sacola ], ...] */
  window.__lbS = function (u, a) {
    var m = base(), r, p;
    if (!m) return null;
    try { p = new URL(u, location.href).pathname.replace(/\/+$/, ''); } catch (e) { return null; }
    r = m[p];
    if (!r) return null;
    /* só tamanhos de verdade (variações ativas); entradas sem variação ou inativas ficam de fora */
    var v = (r[7] || []).filter(function (x) { return !x[6] && x[4] && x[1] > 0; });
    if (!v.length || v.some(function (x) { return !(x[0] > 0) || !x[5]; })) return null;
    var ok = v.filter(function (x) { return x[3]; });
    if (!ok.length) return null;
    var min = Math.min.apply(null, ok.map(function (x) { return x[1]; }));
    var el = a && a.querySelector('.lbR'), mostrado = el ? reais(el.textContent) : 0;
    if (!mostrado || Math.abs(mostrado - min) > 0.005) return null;
    return {
      t: Date.now(),
      v: v.slice().sort(function (x, y) { return x[0] - y[0] || x[1] - y[1]; })
        .map(function (x) { return [String(x[0]).replace('.', ',') + ' ml', x[1], x[3] ? 1 : 0, String(x[5])]; })
    };
  };
})();
</script>
