<!-- LOJABIT - Confiança: "Por que comprar na @LOJABIT" (produto, decants, sacola e rodapé). Publicado em 01/11/2026. -->
<style>
.lbpq-kick{display:block;margin:0 0 2px;font:500 10.5px/1.3 Jost,"Helvetica Neue",Arial,sans-serif;letter-spacing:2.1px;text-transform:uppercase;color:#8F6E2E}
.lbs-garantias li a.lbpq-ver{margin-left:4px;white-space:nowrap;font-weight:500;color:#8F6E2E!important;text-decoration:underline!important;text-underline-offset:2px}
.lbs-garantias li a.lbpq-ver:hover{color:#0A0A0B!important}
.lbpq-faixa{display:grid;grid-template-columns:repeat(4,1fr);margin:18px 0 6px;border:1px solid rgba(201,165,92,.45);border-radius:10px;background:#FAF7F2;overflow:hidden;font-family:Jost,"Helvetica Neue",Arial,sans-serif}
.lbpq-faixa a{display:flex;flex-direction:column;gap:3px;padding:12px 16px;border-left:1px solid rgba(201,165,92,.35);color:#403A34!important;text-decoration:none!important}
.lbpq-faixa a:first-child{border-left:0}
.lbpq-faixa b{font-size:13.5px;font-weight:600;color:#0A0A0B}
.lbpq-faixa b em{font-style:normal;color:#C9A55C;letter-spacing:1px;margin-right:4px}
.lbpq-faixa span{font-size:11.5px;line-height:1.35;color:#6b6252}
.lbpq-faixa i{font-style:normal;color:#8F6E2E;text-decoration:underline;text-underline-offset:2px}
.lbpq-faixa a:hover b{text-decoration:underline}
.lbpq-sac{margin:10px 0 0;text-align:center;font:400 12px/1.5 Jost,"Helvetica Neue",Arial,sans-serif;color:#6b6252}
.lbpq-sac a{color:#8F6E2E!important;text-decoration:underline!important;text-underline-offset:2px}
.lbpq-faixa-cel{margin:4px 0 16px!important}
#rodape .lbpq-badge-off{display:none!important}
@media(max-width:767px){.lbpq-faixa{grid-template-columns:1fr 1fr;margin-top:14px}.lbpq-faixa a{padding:11px 12px}.lbpq-faixa a:nth-child(3){border-left:0}.lbpq-faixa a:nth-child(n+3){border-top:1px solid rgba(201,165,92,.35)}.lbpq-faixa b{font-size:13px}}
</style>
<script>
(function () {
  'use strict';
  var K = 'lbconf';
  try {
    if (/[?&]lbconf=1/.test(location.search)) sessionStorage.setItem(K, '1');
    if (/[?&]lbconf=0/.test(location.search)) sessionStorage.removeItem(K);
  } catch (e) {}
  /* publicado em 01/11/2026 (aprovado pelo Nevander); para voltar à prévia, recolocar: if (sessionStorage.getItem(K) !== '1') return; */

  var MAPA = 'https://maps.app.goo.gl/39qh4fCFyPqTUp539?g_st=ac';
  var TROCAS = '/pagina/trocas-devolucoes-e-garantia.html';
  var SEGURO = '/pagina/e-seguro-comprar-na-lojabit.html';
  var NOTA = '4,9', AVAL = '474';
  var ANOS = new Date().getFullYear() - 2014 - (new Date() < new Date(new Date().getFullYear(), 11, 14) ? 1 : 0);

  function el(html) { var d = document.createElement('div'); d.innerHTML = html; return d.firstChild; }
  function link(u, t) { var ext = /^https?:/.test(u); return ' <a class="lbpq-ver" href="' + u + '"' + (ext ? ' target="_blank" rel="noopener"' : '') + '>' + t + ' ›</a>'; }
  function li(b, t, u, lt) { return '<li data-lbpq="1"><b>' + b + '</b> ' + t + (u ? link(u, lt) : '') + '</li>'; }
  function avaliacoes() { var a = document.getElementById('lbxPgD'); var m = a && a.textContent.match(/(\d[\d.]*)\s*avalia/); return m ? m[1] : AVAL; }

  /* Página do produto: a caixa "Separado, conferido e embalado pelos próprios donos" vira "Por que comprar na @LOJABIT" */
  function produto() {
    if (!document.querySelector('.pagina-produto')) return true;
    var box = document.querySelector('.lbs-prod');
    if (!box || box.getAttribute('data-lbpq')) return !!box;
    box.setAttribute('data-lbpq', '1');
    var txt = box.querySelector('.lbs-prod-txt');
    if (txt) txt.insertBefore(el('<span class="lbpq-kick">Por que comprar na @LOJABIT</span>'), txt.firstChild);
    var ul = box.querySelector('.lbs-garantias');
    if (!ul) return true;
    var itens = [].slice.call(ul.children);
    itens.forEach(function (x) {
      var b = x.querySelector('b'); if (!b) return;
      if (/original/i.test(b.textContent)) x.insertAdjacentHTML('beforeend', link(SEGURO, 'Como garantimos'));
    });
    var dev = el(li('Devolução em até 30 dias, sem custo:', 'etiqueta dos Correios por nossa conta e todo o valor de volta', TROCAS, 'Como funciona'));
    ul.insertBefore(dev, itens[1] || null);
    ul.appendChild(el(li('Loja física em Volta Redonda', 'há ' + ANOS + ' anos, no Aterrado Center Shopping', MAPA, 'Como chegar')));
    return true;
  }

  /* Página /decants: faixa com 4 provas, logo abaixo do título e das marcas */
  function decants() {
    if (!/^\/decants\/?$/.test(location.pathname) || document.querySelector('.lbpq-faixa')) return true;
    var cab = document.querySelector('.lbw-cab'), guia = document.querySelector('section.lbdi');
    if (!cab && !guia) return false;
    var f = el('<div class="lbpq-faixa" role="list">' +
      '<a role="listitem" href="' + MAPA + '" target="_blank" rel="noopener"><b><em>★★★★★</em>' + NOTA + ' no Google</b><span>' + AVAL + ' avaliações da loja física · <i>ver</i></span></a>' +
      '<a role="listitem" href="' + SEGURO + '"><b>Do mesmo frasco original</b><span>que vendemos lacrado, em frasco de vidro novo · <i>como garantimos</i></span></a>' +
      '<a role="listitem" href="' + TROCAS + '"><b>Devolução em até 30 dias</b><span>sem custo, etiqueta dos Correios por nossa conta · <i>como funciona</i></span></a>' +
      '<a role="listitem" href="' + MAPA + '" target="_blank" rel="noopener"><b>Loja física desde 2014</b><span>Aterrado, Volta Redonda · <i>como chegar</i></span></a>' +
      '</div>');
    if (cab) cab.appendChild(f); /* computador: abaixo do título e das marcas */
    else { f.className += ' lbpq-faixa-cel'; guia.parentNode.insertBefore(f, guia); } /* celular: antes do guia do decant */
    return true;
  }

  /* Sacola: linha de garantia logo abaixo do selo 4,9 */
  function sacola() {
    if (!/carrinho/.test(location.pathname) || document.querySelector('.lbpq-sac')) return true;
    var s = [].filter.call(document.querySelectorAll('a[href*="maps.app.goo.gl"]'), function (a) { return /4,9/.test(a.textContent) && !(a.closest && a.closest('.lbtc')); })[0];
    if (!s) return false;
    s.insertAdjacentElement('afterend', el('<p class="lbpq-sac">Devolução em até 30 dias, sem custo · <a href="' + TROCAS + '">como funciona</a></p>'));
    return true;
  }

  /* Rodapé: esconde o selo vazio do Google Avaliações do Consumidor e mostra a nota da loja física */
  function rodape() {
    var r = document.getElementById('rodape');
    if (!r) return false;
    var badge = r.querySelector('#___ratingbadge_0');
    if (badge) { var p = badge.closest('li') || badge; p.classList.add('lbpq-badge-off'); }
    if (r.querySelector('[data-lbpq-nota]')) return !!badge || n > 12;
    var lista = [].filter.call(r.querySelectorAll('ul.lbf-lista'), function (u) { return /Safe Browsing/.test(u.textContent); })[0];
    if (!lista) return false;
    lista.appendChild(el('<li data-lbpq-nota="1"><a href="' + MAPA + '" target="_blank" rel="noopener"><b>' + NOTA + ' no Google ★★★★★</b><span>' + avaliacoes() + ' avaliações da nossa loja física</span></a></li>'));
    return !!badge || n > 12;
  }

  /* Página de avaliação do produto (link do e-mail "Avalie os produtos"): ?nota=1..5 já marca a estrela tocada no e-mail */
  function avaliar() {
    if (!/\/conta\/avaliacoes\/.+\/adicionar/.test(location.pathname)) return true;
    var m = location.search.match(/[?&]nota=([1-5])/);
    if (!m) return true;
    var nota = m[1], ta = document.querySelector('form textarea'), box = (ta && ta.form) || document, ok = false;
    function ev(x, t) { try { x.dispatchEvent(new Event(t, { bubbles: true })); } catch (e) {} }
    var r = box.querySelector('input[type=radio][value="' + nota + '"]');
    if (r) { var lab = (r.id && document.querySelector('label[for="' + r.id + '"]')) || r.closest('label'); (lab || r).click(); r.checked = true; ev(r, 'change'); ok = true; }
    if (!ok) { var s = box.querySelector('select[name*=nota], select[name*=avalia], select[name*=rating], select[name*=estrela]'); if (s) { s.value = nota; ev(s, 'change'); ok = true; } }
    if (!ok) { var e = box.querySelector('[data-value="' + nota + '"], [data-rating="' + nota + '"], [data-nota="' + nota + '"], [data-score="' + nota + '"], [data-star="' + nota + '"]'); if (e) { e.click(); ok = true; } }
    if (ok && ta) ta.scrollIntoView({ block: 'center' });
    return ok || n > 20;
  }

  var n = 0;
  (function tick() {
    var ok = [produto(), decants(), sacola(), rodape(), avaliar()].every(Boolean);
    if (!ok && ++n < 40) setTimeout(tick, 500);
  })();
})();
</script>
