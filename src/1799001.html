<script>
/* LOJABIT - DADOS DOS CARROSSÉIS DA PÁGINA DO PRODUTO (04/11/2026; só no repositório, não existe no painel).
   Entrega para o "Visual novo 31" (1718168) as listas "Parecidos com o X" e "Com a mesma proposta" deste perfume;
   o 1718168 desenha com os MESMOS cartões do site (tamanhos e preços dos decants, selos das famílias, sacola no celular).
   Dados: carrossel/p/<id>.json (preço atual da listagem da loja, atualizado por tarefa agendada — ferramentas/carrossel.py).
   O endereço vem de carrossel/v.json (raw.githubusercontent, ~5 min de cache), preso a um commit no jsDelivr.
   Busca só depois que a página carregou (não disputa a internet com a foto do produto).
   window.__lbCarrGet(cb) -> cb({n, g, t, p:[cartões], m:[cartões]}) ou cb(null) se o perfume não tem dados. */
(function () {
  if (window.__lbCarrGet) return;
  var REPO = 'suedgrisoni/lojabit-site', fila = null, feito = false, res = null;
  function idDoProduto() {
    var a = document.querySelector('a[href*="/conta/favorito/"][href$="/adicionar"]');
    return a && (a.getAttribute('href').match(/favorito\/(\d+)\//) || [])[1];
  }
  function get(urls, ok, falha) {
    var u = urls.shift(); if (!u) { falha(); return; }
    var x = new XMLHttpRequest(); x.open('GET', u, true); x.timeout = 8000;
    /* 404 = este perfume ainda não tem carrossel: não adianta tentar o outro endereço (12/11/2026) */
    x.onload = function () { if (x.status === 200) { try { ok(JSON.parse(x.responseText)); return; } catch (e) {} } if (x.status === 404) { falha(); return; } get(urls, ok, falha); };
    x.onerror = x.ontimeout = function () { get(urls, ok, falha); };
    x.send();
  }
  function fim(D) { feito = true; res = D; var f = fila || []; fila = []; f.forEach(function (c) { try { c(D); } catch (e) {} }); }
  function ehPerfume() {
    var h = document.querySelector('h1.nome-produto, .produto h1'), t = h ? h.textContent : document.title;
    return /^\s*(Perfume|Decant)/i.test(t || '');
  }
  function busca() {
    /* só perfumes têm carrossel (relógio, creme, body splash e kit ficam com o "Perfumes parecidos" antigo) */
    var id = idDoProduto(); if (!id || !ehPerfume()) { fim(null); return; }
    get(['https://raw.githubusercontent.com/' + REPO + '/main/carrossel/v.json?t=' + Math.floor(Date.now() / 3e5)], function (v) {
      if (!v || !/^[0-9a-f]{40}$/.test(v.h)) { fim(null); return; }
      var cam = '/gh/' + REPO + '@' + v.h + '/carrossel/p/' + id + '.json';
      get(['https://cdn.jsdelivr.net' + cam, 'https://fastly.jsdelivr.net' + cam], fim, function () { fim(null); });
    }, function () { fim(null); });
  }
  window.__lbCarrGet = function (cb) {
    if (feito) { cb(res); return; }
    if (fila) { fila.push(cb); return; }
    fila = [cb];
    if (document.readyState === 'complete') setTimeout(busca, 300); else window.addEventListener('load', function () { setTimeout(busca, 300); });
  };
})();
</script>
