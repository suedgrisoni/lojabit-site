<script>
/* LOJABIT - visual novo 15: Departamentos novo (painel em duas colunas + famílias e ocasiões).
   PUBLICADO = false -> só aparece no navegador que abriu www.lojabit.com/?lbdep=1 (desliga com ?lbdep=0).
   PUBLICADO = true  -> aparece para todos os clientes. O código "Visual novo 16" monta o painel. */
(function () {
  var PUBLICADO = true;
  var on = PUBLICADO;
  try {
    var q = location.search;
    if (/[?&]lbdep=1(&|$)/.test(q)) localStorage.setItem('lbDep', '1');
    if (/[?&]lbdep=0(&|$)/.test(q)) localStorage.removeItem('lbDep');
    if (localStorage.getItem('lbDep') === '1') on = true;
  } catch (e) {}
  if (on) document.documentElement.className += ' lbdep';
})();
</script>
