<style>
/* LOJABIT - Menu Relógios em dois grupos: "Por marca" e "Por tipo e ocasião" (14/11/2026).
   Só CSS: página-guia é o item cujo endereço tem "relogio" (/relogios-de-mergulho, /primeiro-relogio-automatico...); marca é o resto
   (/seiko). Guia ou marca nova entra no grupo certo sozinha. Vale quando o <html> tem a classe lbmr (ver o script). */
html.lbmr li.categoria-id-24410277>ul.nivel-dois>li{order:2}
html.lbmr li.categoria-id-24410277>ul.nivel-dois>li.lbm-ver,html.lbmr li.categoria-id-24410277>ul.nivel-dois>li.lbm-todos{order:0}
html.lbmr li.categoria-id-24410277>ul.nivel-dois>li:has(>a[href*="relogio"]):not(.lbm-ver):not(.lbm-todos){order:4}
html.lbmr li.categoria-id-24410277>ul.nivel-dois:before,html.lbmr li.categoria-id-24410277>ul.nivel-dois:after{display:block!important;position:static!important;width:auto!important;height:auto!important;border:0!important;background:none!important;transform:none!important;font:600 10.5px/1.2 Jost,Arial,sans-serif!important;letter-spacing:.2em!important;text-transform:uppercase!important;color:#8F6E2E!important}
html.lbmr li.categoria-id-24410277>ul.nivel-dois:before{content:"Por marca"!important;order:1}
html.lbmr li.categoria-id-24410277>ul.nivel-dois:after{content:"Por tipo e ocasião"!important;order:3}
/* computador: menu largo em grade; cada título ocupa a linha inteira */
html.lbmr .main-menu-desktop li.categoria-id-24410277>ul.nivel-dois:before,html.lbmr .main-menu-desktop li.categoria-id-24410277>ul.nivel-dois:after{grid-column:1/-1;flex:0 0 100%;padding:14px 2px 2px}
html.lbmr .main-menu-desktop li.categoria-id-24410277>ul.nivel-dois>li.lbm-ver{grid-column:1/-1}
/* celular: marcas e tipos viram botões lado a lado (a lista fica com metade da altura) */
html.lbmr .main-menu-mobile li.categoria-id-24410277>ul.nivel-dois{flex-direction:row!important;flex-wrap:wrap!important;align-items:flex-start!important;gap:8px!important;margin:0!important;padding:2px 12px 16px 10px!important}
html.lbmr .main-menu-mobile li.categoria-id-24410277>ul.nivel-dois:before,html.lbmr .main-menu-mobile li.categoria-id-24410277>ul.nivel-dois:after{flex:0 0 100%;padding:10px 0 0}
html.lbmr .main-menu-mobile li.categoria-id-24410277>ul.nivel-dois>li.lbm-todos{flex:0 0 100%}
html.lbmr .main-menu-mobile li.categoria-id-24410277>ul.nivel-dois>li.lbm-todos{margin:0!important;padding:0!important}
html.lbmr .main-menu-mobile li.categoria-id-24410277>ul.nivel-dois>li:not(.lbm-todos){flex:0 0 auto!important;width:auto!important;max-width:100%;margin:0!important;padding:0!important;border:0!important}
html.lbmr .main-menu-mobile li.categoria-id-24410277>ul.nivel-dois>li:not(.lbm-todos)>a{display:block!important;padding:10px 14px!important;border:1px solid #ECE5DA!important;border-radius:99px!important;background:#fff!important;font:500 14px/1.2 Jost,Arial,sans-serif!important;color:#0A0A0B!important;white-space:nowrap}
</style>
<script>
/* Menu Relógios em dois grupos. Publicado para todos em 14/11/2026 (PUBLICADO = true; com false volta a ser prévia:
   liga com ?lbmenu=1 e desliga com ?lbmenu=0, guardado no aparelho). Fica antes do 1717276 (Departamentos) na ordem. */
(function () {
  var PUBLICADO = true; /* publicado para todos em 14/11/2026 */
  try {
    var s = location.search;
    if (/[?&]lbmenu=1(&|$)/.test(s)) localStorage.setItem('lbMenuRel', '1');
    if (/[?&]lbmenu=0(&|$)/.test(s)) localStorage.removeItem('lbMenuRel');
    if (PUBLICADO || localStorage.getItem('lbMenuRel') === '1') document.documentElement.classList.add('lbmr');
  } catch (e) { if (PUBLICADO) document.documentElement.classList.add('lbmr'); }
})();
</script>
