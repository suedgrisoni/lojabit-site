<style>
/* LOJABIT - Relógios: "O relógio em números" (ficha em movimento). Só nas páginas de relógio. Lê a ficha técnica da descrição. */
.lbrn{--i:#0A0A0B;--t:#403A34;--m:#776E64;--o:#8F6E2E;--o2:#C9A55C;--c:#FAF7F2;--l:#ECE5DA;margin:8px 0 26px;font-family:Jost,Arial,sans-serif;color:var(--t)}
.lbrn *{box-sizing:border-box}
.lbrn-cab{text-align:center;padding:0 16px;margin-bottom:14px}
.lbrn-k{font:600 10.5px/1.2 Jost,Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--o)}
.lbrn-h{font:500 30px/1.1 "Cormorant Garamond",Georgia,serif;color:var(--i);margin:6px 0 4px}
.lbrn-h em{color:var(--o)}
.lbrn-s{font-size:13px;color:var(--m);margin:0}
.lbrn-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:0 12px;margin:0 0 16px}
.lbrn-chips span{font:500 12px/1 Jost,Arial,sans-serif;padding:7px 11px;border:1px solid var(--l);border-radius:99px;background:#fff;color:var(--t);white-space:nowrap}
.lbrn-chips span b{color:var(--o);font-weight:600}
.lbrn-tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;padding:0 2px}
.lbrn-tiles .lbrn-t{flex:0 0 calc((100% - (var(--cols,5) - 1) * 12px) / var(--cols,5))}
@media (max-width:767px){.lbrn-tiles{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;padding:2px 16px 8px;margin:0 -16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.lbrn-tiles::-webkit-scrollbar{display:none}.lbrn-tiles .lbrn-t{flex:0 0 66%;scroll-snap-align:center}}
.lbrn-t{position:relative;background:var(--c);border:1px solid var(--l);border-radius:16px;padding:14px 14px 16px;text-align:center;cursor:default;overflow:hidden}

.lbrn-n small{font:500 12px/1 Jost,Arial,sans-serif;color:var(--o);margin-left:4px;letter-spacing:.06em;text-transform:uppercase}

.lbrn-x{font-size:12.5px;line-height:1.45;color:var(--m);min-height:36px}
.lbrn-x b{color:var(--t);font-weight:600}
.lbrn-dica{display:inline-block;margin-top:8px;font:600 10px/1 Jost,Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--o);border-bottom:1px solid var(--o2);padding-bottom:2px}

.lbrn-ic i{display:flex;flex-direction:column;align-items:center;gap:3px;font:500 9px/1.1 Jost,Arial,sans-serif;font-style:normal;color:#b8afa3;width:44px;transition:color .4s}

.lbrn-on .lbrn-ic i.ok{color:var(--t)}

.lbrn svg .s{fill:none;stroke:var(--i);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.lbrn svg .so{fill:none;stroke:var(--o);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.lbrn svg .fo{fill:var(--o)}
.lbrn svg .fi{fill:var(--i)}
.lbrn svg .fc{fill:#fff}
.lbrn svg .tx{font:600 7.5px Jost,Arial,sans-serif;fill:var(--m);letter-spacing:.06em}

.lbrn-on .dm-ge,.lbrn-on .dm-gd{transform:none}

.lbrn-esc{position:relative;height:4px;border-radius:4px;background:linear-gradient(90deg,#e7dfd2,#c9a55c,#8F6E2E);margin:10px 4px 4px}
.lbrn-esc u{position:absolute;top:50%;left:0;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;border:2px solid var(--i);transition:left 1.4s cubic-bezier(.2,.8,.2,1) .6s}

.lbrn-on .es-punho{transform:none;opacity:1}

.lbrn-on .bt-ps{animation:lbrnSeg 60s steps(var(--st,360)) infinite}

.lbrn .qz-d{transform-origin:46px 70px}
.lbrn-on .qz-d1{animation:lbrnVib .09s linear infinite alternate}
.lbrn-on .qz-d2{animation:lbrnVib .09s linear infinite alternate-reverse}
@keyframes lbrnVib{from{transform:translateX(-.9px)}to{transform:translateX(.9px)}}
.lbrn .sl-raios{transform-origin:40px 40px}
.lbrn-on .sl-raios{animation:lbrnGira 14s linear infinite}

.lbrn .sl-c{opacity:.15}
.lbrn-on .sl-c{animation:lbrnCarga 3.2s ease-in-out infinite}
.lbrn-on .sl-c2{animation-delay:.4s}.lbrn-on .sl-c3{animation-delay:.8s}.lbrn-on .sl-c4{animation-delay:1.2s}
@keyframes lbrnCarga{0%,15%{opacity:.15}40%,85%{opacity:1}100%{opacity:.15}}
/* 4. reserva */
.lbrn .rm-arco{stroke-dasharray:251;stroke-dashoffset:251;transition:stroke-dashoffset 1.8s cubic-bezier(.3,.7,.2,1) .4s}
.lbrn-dias{display:flex;justify-content:center;gap:3px;margin:8px 0 2px}
.lbrn-dias i{font:600 8.5px/1 Jost,Arial,sans-serif;font-style:normal;width:21px;padding:5px 0;border-radius:5px;background:#efe9df;color:#a39a8e;transition:background .3s,color .3s}
.lbrn-dias i.ok{background:var(--i);color:#fff}
.lbrn-dias i.meio{background:linear-gradient(90deg,var(--i) 50%,#efe9df 50%);color:#fff}
/* 5. água */
.lbrn .ag-nivel{transform:translateY(102px);transition:transform 2s cubic-bezier(.3,.7,.2,1) .3s}
.lbrn .ag-onda{animation:lbrnOnda 3s linear infinite;animation-play-state:paused}
.lbrn-on .ag-onda{animation-play-state:running}
@keyframes lbrnOnda{to{transform:translateX(-40px)}}
.lbrn .ag-b{opacity:0}
.lbrn-on .ag-b{animation:lbrnBolha 2.6s ease-in infinite}
.lbrn-on .ag-b2{animation-delay:.9s}.lbrn-on .ag-b3{animation-delay:1.7s}
@keyframes lbrnBolha{0%{opacity:0;transform:translateY(0)}20%{opacity:.9}100%{opacity:0;transform:translateY(-34px)}}
/* 6. vidro */
.lbrn .vd-ponta{transform:translate(18px,30px);opacity:0}
.lbrn-on .vd-ponta{animation:lbrnRisca 2.6s ease-in-out .6s infinite}
@keyframes lbrnRisca{0%{transform:translate(18px,30px);opacity:0}10%{opacity:1}55%{transform:translate(100px,88px);opacity:1}65%,100%{transform:translate(100px,88px);opacity:0}}
.lbrn .vd-br{opacity:0;transform-origin:center;transform-box:fill-box}
.lbrn-on .vd-br{animation:lbrnBrilho 2.6s ease .6s infinite}
.lbrn-on .vd-br2{animation-delay:1s}.lbrn-on .vd-br3{animation-delay:1.4s}
@keyframes lbrnBrilho{0%,20%{opacity:0;transform:scale(.3)}35%{opacity:1;transform:scale(1)}55%,100%{opacity:0;transform:scale(.3)}}
.lbrn .vd-risco{stroke-dasharray:110;stroke-dashoffset:110}
.lbrn-on .vd-risco{animation:lbrnRiscoM 2.6s ease-in-out .6s infinite}
@keyframes lbrnRiscoM{0%{stroke-dashoffset:110;opacity:.9}55%{stroke-dashoffset:0;opacity:.9}100%{stroke-dashoffset:0;opacity:.35}}
.lbrn-mohs{display:flex;gap:2px;margin:9px 6px 2px}
.lbrn-mohs i{flex:1;height:6px;border-radius:2px;background:#eae3d7;transition:background .25s}
.lbrn-mohs i.ok{background:var(--o)}
.lbrn-mohs i.dia{background:repeating-linear-gradient(45deg,#d9d1c4 0 2px,#eae3d7 2px 4px)}
/* 7. peso */
.lbrn .ps-pt{transform-origin:60px 74px;transform:rotate(-80deg);transition:transform 1.6s cubic-bezier(.3,1.4,.4,1) .5s}
/* 8. luz */
.lbrn-lz{transition:background .6s}
.lbrn .lz-fundo{fill:#fff;transition:fill .7s}
.lbrn .lz-lu{fill:#e9e2d6;stroke:var(--i);stroke-width:.8;transition:fill .7s,stroke .7s,filter .7s}
.lbrn .lz-aro{fill:none;stroke:var(--i);stroke-width:2;transition:stroke .7s}
.lbrn-lz.noite{background:#0d1014;border-color:#0d1014}
.lbrn-lz.noite .lbrn-n,.lbrn-lz.noite .lbrn-l{color:#e8f7ee}
.lbrn-lz.noite .lbrn-x{color:#9fb3a8}
.lbrn-lz.noite .lz-fundo{fill:#0d1014}
.lbrn-lz.noite .lz-aro{stroke:#2a3138}
.lbrn-lz.noite .lz-lu{fill:#b9ffd4;stroke:#b9ffd4;filter:drop-shadow(0 0 3px #6dffa8)}
/* 9. movimento à mostra */
.lbrn .mv-rotor{transform-origin:60px 60px}
.lbrn-on .mv-rotor{animation:lbrnRotor 4.5s cubic-bezier(.45,0,.3,1) infinite}
@keyframes lbrnRotor{0%{transform:rotate(-40deg)}35%{transform:rotate(250deg)}55%{transform:rotate(190deg)}100%{transform:rotate(320deg)}}
.lbrn .mv-bal{transform-origin:78px 44px}
.lbrn-on .mv-bal{animation:lbrnBal var(--bt,.1667s) ease-in-out infinite alternate}
/* 10. cronógrafo e GMT */
.lbrn .cr-pt{transform-origin:60px 62px;transition:transform .15s}
.lbrn-cr-v{font-variant-numeric:tabular-nums;display:inline-block;min-width:2.2em}
.lbrn .gm-24{transform-origin:60px 60px}
.lbrn-on .gm-24{animation:lbrnGira 12s linear infinite}
.lbrn .gm-h{transform-origin:60px 60px}
.lbrn-on .gm-h{animation:lbrnGira 6s linear infinite}
/* pulso */
.lbrn-pul{margin:16px 0 0;background:#fff;border:1px solid var(--l);border-radius:16px;padding:16px;display:grid;grid-template-columns:1fr;gap:6px;text-align:center}

.lbrn-pul h3{font:500 22px/1.15 "Cormorant Garamond",Georgia,serif;color:var(--i);margin:0 0 4px}
.lbrn-pul p{font-size:12.5px;color:var(--m);margin:0}
.lbrn-pul svg{width:100%;max-width:300px;height:auto;display:block;margin:0 auto}
.lbrn-pul input[type=range]{width:100%;accent-color:#8F6E2E;margin:12px 0 4px}
.lbrn-pv{font:600 13px/1.35 Jost,Arial,sans-serif;color:var(--i);margin-top:6px}
.lbrn-pv span{display:block;font-weight:400;color:var(--m);font-size:12px;margin-top:3px}
.lbrn-pm{font:500 26px/1 "Cormorant Garamond",Georgia,serif;color:var(--o)}
.lbrn-nota{font-size:10.5px;color:#a39a8e;text-align:center;margin:10px 0 0}
@media (prefers-reduced-motion:reduce){.lbrn *,.lbrn *:before,.lbrn *:after{animation:none!important;transition:none!important}}
</style>
<script>
/* LOJABIT - Relógios: "O relógio em números" (ficha em movimento) — 13/11/2026.
   Só em página de relógio. Os números vêm da "Ficha técnica" da descrição (Movimento, Reserva de marcha, Caixa,
   Vidro, Resistência à água, Peso, Funções, Fundo, Luminescência, Frequência...). Relógio novo cadastrado com a mesma
   ficha ganha o painel sozinho. Cada cartão só aparece se o dado existir; nada é inventado.
   Este arquivo (dist/rel.js) só é carregado nas páginas de relógio, pelo código 1799005 (que também decide a prévia). */
(function () {
  'use strict';
  if (window.__lbRel) return;

  }

    [/sw ?200|eta 2824|a05\.h31|valjoux 7750/, 28800]];
  function dados() {
    var f = ficha(), r = {};
    var mov = sa(f.movimento), cx = sa(f.caixa), ag = sa(f['resistencia a agua']), fu = sa(f.funcoes), vd = sa(f.vidro), nome = sa((document.querySelector('h1.nome-produto') || {}).textContent);
    if (!mov && !cx) return null;
    r.tipo = /solar|eco-drive|movido a luz/.test(mov) ? 'solar' : /quartzo|pilha|bateria/.test(mov) ? 'quartzo' : /automatico/.test(mov) ? 'auto' : /manual|corda/.test(mov) ? 'manual' : '';
    var m = /calibre ([\w.\-]+(?: [\w.]+)?)/i.exec(f.movimento || '') || /\b(nh3\d\w?|sw ?200-?\d?|powermatic 80[.\d]*)/i.exec(f.movimento || '');

    m = /(\d{2}(?:[.,]\d+)?)\s*(?:x\s*\d{2}(?:[.,]\d+)?\s*)?mm(?: de di[âa]metro)?/i.exec(f.caixa || '');
    if (m && num(m[1]) >= 24 && num(m[1]) <= 60) r.diam = num(m[1]);
    m = /(\d{1,2}(?:[.,]\d+)?)\s*mm de espessura/i.exec(f.caixa || '');
    if (m) r.esp = num(m[1]);
    m = /(\d{2}(?:[.,]\d+)?)\s*mm (?:de ponta a ponta|entre (?:as )?al[çc]as)/i.exec(f.caixa || '') || /(\d{2}(?:[.,]\d+)?)/.exec(f['distancia entre as alcas (lug-to-lug)'] || '');
    if (m && num(m[1]) > 34) r.l2l = num(m[1]);
    r.mat = /titanio|titanium/.test(cx) ? 'titânio' : /bronze/.test(cx) ? 'bronze' : /ceramica/.test(cx) ? 'cerâmica' : /latao/.test(cx) ? 'latão' : /aco/.test(cx) ? 'aço' : '';
    m = /(\d+)\s*bar/.exec(ag) || /(\d+)\s*atm/.exec(ag);
    if (m) r.agua = +m[1] * 10; else if ((m = /(\d+)\s*(?:metros|m\b)/.exec(ag))) r.agua = +m[1];
    m = /(\d{1,2}\.\d{3}|\d{5})\s*(?:alternancias|vph|a\/h)/.exec(sa(f.frequencia || '') + ' ' + mov);
    if (m) r.freq = num(m[1]);
    else if (r.tipo === 'auto' || r.tipo === 'manual') FREQ.some(function (x) { if (x[0].test(mov)) { r.freq = x[1]; return true; } return false; });
    m = /(\d+)\s*horas/.exec(sa(f['reserva de marcha'] || ''));
    if (m) r.reserva = +m[1];
    m = /(\d+)\s*mes/.exec(sa((f['reserva de carga'] || '') + ' ' + (f.autonomia || '')));
    if (m) r.meses = +m[1];
    r.vidro = /safira/.test(vd) ? 'safira' : /hardlex/.test(vd) ? 'hardlex' : /acrilic/.test(vd) ? 'acrilico' : /mineral/.test(vd) ? 'mineral' : '';
    r.ar = /antirreflex/.test(vd);
    m = /(\d{2,3})\s*g\b/.exec(sa(f.peso || ''));
    if (m) r.peso = +m[1];
    r.lume = !!f.luminescencia || /lumibrite|luminova|luminesc/.test(sa(JSON.stringify(f)));

    r.indiglo = /indiglo/.test(fu + ' ' + sa(f.luminescencia || ''));
    r.fundo = /transparente|safira|exib/.test(sa(f.fundo || ''));

    r.gmt = /gmt|segundo fuso/.test(fu + ' ' + nome);
    r.prec = (/precis[ãa]o de ([^,;]+)/i.exec(f.movimento || '') || /([±+\-][^,;]*segundos[^,;]*)/.exec(f.precisao || '') || [])[1] || '';

    r.hack = /parada dos segundos|hacking/.test(mov) || /segundos com parada/.test(fu);

    return r;
  }

  /* ---------- peças ---------- */
  function svg(html) { return '<svg viewBox="0 0 120 120" aria-hidden="true" focusable="false">' + html + '</svg>'; }
  function tile(k, sv, n, un, rot, x, extra, toque) {

      '<div class="lbrn-n">' + n + (un ? '<small>' + un + '</small>' : '') + '</div><div class="lbrn-l">' + rot + '</div><div class="lbrn-x">' + x + '</div>' + (extra || '') + '</div>';
  }
  function conta(v, d) { return '<b data-v="' + v + '" data-d="' + (d || 0) + '">' + br(v, d) + '</b>'; }
  function decimais(v) { return v % 1 ? 1 : 0; }
  function mostrador(cx, cy, r) {
    var s = '';
    for (var i = 0; i < 12; i++) {

    }

  }

    chuva: '<path d="M7 14a5 5 0 0 1 1-9.9A6 6 0 0 1 19 7a4 4 0 0 1-1 7.9H7z"/><path d="M9 18l-1 3M13 18l-1 3M17 18l-1 3"/>',
    maos: '<path d="M12 3s-5 6-5 9.5a5 5 0 0 0 10 0C17 9 12 3 12 3z"/>',
    nado: '<circle cx="16" cy="6" r="2"/><path d="M3 19c2 0 2-1.5 4.5-1.5S10 19 12 19s2-1.5 4.5-1.5S19 19 21 19M6 15l4-4 3 2 3-4"/>',
    snorkel: '<path d="M3 18c2 0 2-1.5 4.5-1.5S10 18 12 18s2-1.5 4.5-1.5S19 18 21 18"/><rect x="5" y="7" width="10" height="5" rx="2.5"/><path d="M18 3v8a3 3 0 0 1-3 3"/>',

      '<div class="lbrn-tiles" style="--cols:' + (t.length <= 5 ? t.length : t.length <= 8 ? Math.ceil(t.length / 2) : 5) + '">' + t.join('') + '</div>' + (r.diam ? pulso(r) : '') +
      '<p class="lbrn-nota">Dados da ficha técnica do fabricante. Animações ilustrativas.</p>';
    return sec;
  }

  /* ---------- simulador de pulso ---------- */
  function pulso(r) {
    return '<div class="lbrn-pul"><div><svg viewBox="0 0 300 150" aria-hidden="true"><defs><linearGradient id="lbrnPele" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9d3bd"/><stop offset=".5" stop-color="#f3e2d1"/><stop offset="1" stop-color="#e2c8ae"/></linearGradient></defs>' +
      '<rect class="lbrn-braco" x="-80" y="45" width="460" height="60" rx="30" fill="url(#lbrnPele)"/>' +
      '<g class="lbrn-rel"><rect class="lbrn-pul-p" x="135" y="0" width="30" height="150" rx="6" fill="#403A34" opacity=".9"/><circle class="lbrn-pul-c" cx="150" cy="75" r="20" fill="#fff" stroke="#0A0A0B" stroke-width="2.5"/>' +
      '<circle cx="150" cy="75" r="15" fill="#f6f2ea"/><path d="M150 75V64M150 75l7 4" stroke="#0A0A0B" stroke-width="1.8" stroke-linecap="round"/></g></svg></div>' +
      '<div><div class="lbrn-k">Simulador</div><h3>Vai ficar bom no seu pulso?</h3><p>Arraste até a medida do seu pulso (passe uma fita ou barbante em volta).</p>' +
      '<input type="range" min="14" max="22" step=".5" value="17" aria-label="Medida do pulso em centímetros">' +
      '<div><span class="lbrn-pm">17 cm</span></div><div class="lbrn-pv"></div></div></div>';
  }
  function ligaPulso(sec, r) {
    var inp = sec.querySelector('.lbrn-pul input');
    if (!inp) return;
    var braco = sec.querySelector('.lbrn-braco'), c = sec.querySelector('.lbrn-pul-c'), p = sec.querySelector('.lbrn-pul-p'), pm = sec.querySelector('.lbrn-pm'), pv = sec.querySelector('.lbrn-pv');
    var l2l = r.l2l || r.diam * 1.2;
    function atual() {
      var cm = +inp.value, larg = cm * 10 * .32, esc = 2.1; /* largura do dorso do pulso ≈ 32% da circunferência; 2,1 px por mm */
      var hb = larg * esc;
      braco.setAttribute('y', (75 - hb / 2).toFixed(1));
      braco.setAttribute('height', hb.toFixed(1));
      braco.setAttribute('rx', (hb / 2).toFixed(1));
      c.setAttribute('r', (r.diam / 2 * esc).toFixed(1));
      var pw = Math.min(r.diam * .52, 24) * esc;
      p.setAttribute('x', (150 - pw / 2).toFixed(1));
      p.setAttribute('width', pw.toFixed(1));
      p.setAttribute('y', (75 - l2l / 2 * esc - 40).toFixed(1));
      p.setAttribute('height', (l2l * esc + 80).toFixed(1));
      pm.textContent = String(cm).replace('.', ',') + ' cm';
      var q = l2l / larg, v, s;
      if (q <= .78) { v = 'Fica discreto e elegante'; s = 'Bem dentro do pulso, estilo clássico.'; }
      else if (q <= .95) { v = 'Proporção ideal'; s = 'O relógio ocupa o pulso na medida certa.'; }
      else if (q <= 1.03) { v = 'Fica marcante'; s = 'Presença forte, ainda dentro da largura do pulso.'; }
      else { v = 'Fica grande'; s = 'As alças passam um pouco da largura do pulso: visual esportivo e ousado.'; }
      pv.innerHTML = v + '<span>' + s + ' Simulação aproximada pelo diâmetro' + (r.l2l ? ' e pela medida de ponta a ponta.' : '.') + '</span>';
    }
    inp.addEventListener('input', atual);
    atual();
  }

  /* ---------- animação ao aparecer (cada cartão na 1ª vez que entra na tela) ---------- */
  function acende(t) {
    var red = matchMedia('(prefers-reduced-motion: reduce)').matches;
    [].forEach.call(t.querySelectorAll('[data-v]'), function (b) {
      var v = +b.getAttribute('data-v'), d = +b.getAttribute('data-d'), t0 = 0, D = v > 1000 ? 1800 : 1300;
      if (red) return;
      function q(x) { if (!t0) t0 = x; var p = Math.min(1, (x - t0) / D), e = 1 - Math.pow(1 - p, 3); b.textContent = br(v * e, d); if (p < 1) requestAnimationFrame(q); }
      b.textContent = br(0, d);
      requestAnimationFrame(q);
    });
    var u = t.querySelector('.lbrn-esc u');
    if (u) u.style.left = u.getAttribute('data-pos') + '%';
    var arco = t.querySelector('.rm-arco');
    if (arco) arco.style.strokeDashoffset = (251 * (1 - +arco.getAttribute('data-frac'))).toFixed(1);
    [].forEach.call(t.querySelectorAll('.lbrn-dias i'), function (i, k) {
      var f = +i.getAttribute('data-f');
      setTimeout(function () { i.className = f >= .99 ? 'ok' : f >= .3 ? 'meio' : ''; }, red ? 0 : 500 + k * 380);
    });
    var nv = t.querySelector('.ag-nivel');
    if (nv) nv.style.transform = 'translateY(' + (102 - 84 * +nv.getAttribute('data-lv')).toFixed(1) + 'px)';
    var pt = t.querySelector('.ps-pt');
    if (pt) pt.style.transform = 'rotate(' + pt.getAttribute('data-a') + 'deg)';
    var mh = t.querySelector('.lbrn-mohs');
    if (mh) [].forEach.call(mh.querySelectorAll('i'), function (i, k) {
      setTimeout(function () { i.className = k < 9 ? 'ok' : 'dia'; }, red ? 0 : 400 + k * 110);
    });
    if (t.classList.contains('lbrn-lzw') && !red) setTimeout(function () { t.classList.add('noite'); setTimeout(function () { t.classList.remove('noite'); }, 2600); }, 1400);
  }
  function toques(sec) {
    var cr = { on: false, t0: 0, acc: 0, raf: 0 };
    function pinta(seg) {
      var v = sec.querySelector('.lbrn-cr-v'), p = sec.querySelector('.cr-pt');
      if (v) v.textContent = br(seg, 1);
      if (p) p.style.transform = 'rotate(' + (seg % 60 * 6).toFixed(1) + 'deg)';
    }
    function roda(t) { if (!cr.on) return; pinta(cr.acc + (t - cr.t0) / 1000); cr.raf = requestAnimationFrame(roda); }
    function age(el) {
      var k = el.getAttribute('data-toque');
      if (k === 'luz') el.classList.toggle('noite');
      if (k === 'crono') {
        var dica = el.querySelector('.lbrn-dica');
        if (!cr.on && cr.acc && dica && dica.getAttribute('data-z')) { cr.acc = 0; pinta(0); dica.textContent = 'Toque para iniciar e parar'; dica.removeAttribute('data-z'); return; }
        cr.on = !cr.on;
        if (cr.on) { cr.t0 = performance.now(); cr.raf = requestAnimationFrame(roda); if (dica) dica.textContent = 'Toque para parar'; }
        else { cr.acc += (performance.now() - cr.t0) / 1000; cancelAnimationFrame(cr.raf); if (dica) { dica.textContent = 'Toque para zerar'; dica.setAttribute('data-z', '1'); } }
      }
    }
    sec.addEventListener('click', function (e) { var el = e.target.closest && e.target.closest('[data-toque]'); if (el) age(el); });
    sec.addEventListener('keydown', function (e) { if ((e.key === 'Enter' || e.key === ' ') && e.target.hasAttribute && e.target.hasAttribute('data-toque')) { e.preventDefault(); age(e.target); } });
  }

  function lugar() {
    var d = document.getElementById('descricao');
    if (!d) return null;
    var row = d.closest('.row-fluid');
    return row && row.parentElement ? row : null;
  }
  var n = 0;
  (function roda() {
    var nome = (document.querySelector('h1.nome-produto') || {}).textContent || '';
    if (!/^\s*Rel[óo]gio/i.test(nome)) { if (++n < 20 && !nome) setTimeout(roda, 300); return; }
    var alvo = lugar(), d = document.getElementById('descricao');
    if (!alvo || !d || !d.querySelector('li strong')) { if (++n < 30) setTimeout(roda, 300); return; }
    if (document.querySelector('.lbrn')) return;
    var r = dados();
    if (!r) return;
    var sec = montar(r);
    if (!sec) return;
    alvo.parentElement.insertBefore(sec, alvo);
    ligaPulso(sec, r);
    toques(sec);
    var tiles = [].slice.call(sec.querySelectorAll('.lbrn-t'));
    if (!('IntersectionObserver' in window)) { tiles.forEach(function (t) { t.classList.add('lbrn-on'); acende(t); }); return; }
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        /* animações contínuas só enquanto o cartão está na tela (economiza bateria); números e medidores na 1ª vez */
        e.target.classList.toggle('lbrn-on', e.isIntersecting);
        if (e.isIntersecting && !e.target.__lbrnF) { e.target.__lbrnF = 1; acende(e.target); }
      });
    }, { threshold: .35 });
    tiles.forEach(function (t) { io.observe(t); });
  })();
})();
</script>
