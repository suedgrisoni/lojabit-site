<style>
/* LOJABIT - Relógios: "O relógio em números" (ficha em movimento). Só nas páginas de relógio. Lê a ficha técnica da descrição. */
.lbrn{--i:#0A0A0B;--t:#403A34;--m:#776E64;--o:#8F6E2E;--o2:#C9A55C;--c:#FAF7F2;--l:#ECE5DA;margin:8px 0 26px;font-family:Jost,Arial,sans-serif;color:var(--t)}
.lbrn *{box-sizing:border-box}
.lbrn-cab{text-align:center;padding:0 16px;margin-bottom:14px}
.lbrn-k{font:600 10.5px/1.2 Jost,Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--o)}
.lbrn-h{font:500 30px/1.1 "Cormorant Garamond",Georgia,serif;color:var(--i);margin:6px 0 4px}
.lbrn-h em{color:var(--o)}
.lbrn-s{font-size:13px;color:var(--m);margin:0}
.lbrn-tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;padding:0 2px}
.lbrn-tiles .lbrn-t{flex:0 0 calc((100% - (var(--cols,5) - 1) * 12px) / var(--cols,5))}
@media (max-width:767px){.lbrn-tiles{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;padding:2px 16px 8px;margin:0 -16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.lbrn-tiles::-webkit-scrollbar{display:none}.lbrn-tiles .lbrn-t{flex:0 0 66%;scroll-snap-align:center}}
.lbrn-t{position:relative;background:var(--c);border:1px solid var(--l);border-radius:16px;padding:14px 14px 16px;text-align:center;cursor:default;overflow:hidden}
.lbrn-t[data-toque]{cursor:pointer}
.lbrn-t svg{display:block;width:118px;height:118px;margin:0 auto 6px;overflow:visible}
.lbrn-n{font:500 34px/1 "Cormorant Garamond",Georgia,serif;color:var(--i);letter-spacing:.01em;white-space:nowrap}
.lbrn-n small{font:500 12px/1 Jost,Arial,sans-serif;color:var(--o);margin-left:4px;letter-spacing:.06em;text-transform:uppercase}
.lbrn-l{font:600 10.5px/1.3 Jost,Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--i);margin:7px 0 6px}
.lbrn-x{font-size:12.5px;line-height:1.45;color:var(--m);min-height:36px}
.lbrn-x b{color:var(--t);font-weight:600}
.lbrn-dica{display:inline-block;margin-top:8px;font:600 10px/1 Jost,Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--o);border-bottom:1px solid var(--o2);padding-bottom:2px}
.lbrn-ic{display:flex;justify-content:center;gap:5px;margin-top:9px}
.lbrn-ic i{display:flex;flex-direction:column;align-items:center;gap:3px;font:500 9px/1.1 Jost,Arial,sans-serif;font-style:normal;color:#b8afa3;width:44px;transition:color .4s}
.lbrn-ic i svg{width:22px;height:22px;margin:0;stroke:#cfc6b8;transition:stroke .4s}
.lbrn-on .lbrn-ic i.ok{color:var(--t)}
.lbrn-on .lbrn-ic i.ok svg{stroke:var(--o)}
/* traços comuns */
.lbrn svg .s{fill:none;stroke:var(--i);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.lbrn svg .so{fill:none;stroke:var(--o);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.lbrn svg .fo{fill:var(--o)}
.lbrn svg .fi{fill:var(--i)}
.lbrn svg .fc{fill:#fff}
.lbrn svg .tx{font:600 7.5px Jost,Arial,sans-serif;fill:var(--m);letter-spacing:.06em}
/* 1. diâmetro */
.lbrn .dm-caixa{stroke-dasharray:214;stroke-dashoffset:214}
.lbrn .dm-ge,.lbrn .dm-gd{transition:transform 1.1s cubic-bezier(.2,.8,.2,1) .5s}
.lbrn .dm-ge{transform:translateX(-16px)}.lbrn .dm-gd{transform:translateX(16px)}
.lbrn .dm-cota{transform-origin:60px 106px;transform:scaleX(0);transition:transform .9s ease 1.2s}
.lbrn-on .dm-caixa{animation:lbrnDraw 1.2s ease forwards}
.lbrn-on .dm-ge,.lbrn-on .dm-gd{transform:none}
.lbrn-on .dm-cota{transform:none}
@keyframes lbrnDraw{to{stroke-dashoffset:0}}
.lbrn-esc{position:relative;height:4px;border-radius:4px;background:linear-gradient(90deg,#e7dfd2,#c9a55c,#8F6E2E);margin:10px 4px 4px}
.lbrn-esc u{position:absolute;top:50%;left:0;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;border:2px solid var(--i);transition:left 1.4s cubic-bezier(.2,.8,.2,1) .6s}
.lbrn-esc-l{display:flex;justify-content:space-between;font:500 9px/1 Jost,Arial,sans-serif;color:var(--m);letter-spacing:.04em;margin:0 0 2px}
/* 2. espessura */
.lbrn .es-caixa{transform-origin:60px 78px;transform:scaleY(.15);transition:transform 1.1s cubic-bezier(.2,.8,.2,1) .3s}
.lbrn .es-punho{transform:translateX(-70px);opacity:0;transition:transform 1.2s ease 1.3s,opacity .6s ease 1.3s}
.lbrn-on .es-caixa{transform:none}
.lbrn-on .es-punho{transform:none;opacity:1}
/* 3. batidas */
.lbrn .bt-bal{transform-origin:46px 56px}
.lbrn-on .bt-bal{animation:lbrnBal var(--bt,.1667s) ease-in-out infinite alternate}
@keyframes lbrnBal{from{transform:rotate(-125deg)}to{transform:rotate(125deg)}}
.lbrn .bt-ps{transform-origin:94px 90px}
.lbrn-on .bt-ps{animation:lbrnSeg 60s steps(var(--st,360)) infinite}
@keyframes lbrnSeg{to{transform:rotate(360deg)}}
.lbrn .qz-d{transform-origin:46px 70px}
.lbrn-on .qz-d1{animation:lbrnVib .09s linear infinite alternate}
.lbrn-on .qz-d2{animation:lbrnVib .09s linear infinite alternate-reverse}
@keyframes lbrnVib{from{transform:translateX(-.9px)}to{transform:translateX(.9px)}}
.lbrn .sl-raios{transform-origin:40px 40px}
.lbrn-on .sl-raios{animation:lbrnGira 14s linear infinite}
@keyframes lbrnGira{to{transform:rotate(360deg)}}
.lbrn .sl-c{opacity:.15}
.lbrn-on .sl-c{animation:lbrnCarga 3.2s ease-in-out infinite}
.lbrn-on .sl-c2{animation-delay:.4s}.lbrn-on .sl-c3{animation-delay:.8s}.lbrn-on .sl-c4{animation-delay:1.2s}
@keyframes lbrnCarga{0%,15%{opacity:.15}40%,85%{opacity:1}100%{opacity:.15}}
/* 4. reserva */
.lbrn .rm-arco{stroke-dasharray:251;stroke-dashoffset:251;transition:stroke-dashoffset 1.8s cubic-bezier(.3,.7,.2,1) .4s}
.lbrn-dias{display:flex;justify-content:center;gap:3px;margin:8px 0 2px}
.lbrn-dias i{font:600 8.5px/1 Jost,Arial,sans-serif;font-style:normal;width:21px;padding:5px 0;border-radius:5px;background:#efe9df;color:#a39a8e;transition:background .3s,color .3s}
.lbrn-dias i.ok{background:var(--i);color:#fff}
.lbrn-dias i.meio{background:linear-gradient(90deg,var(--i) 50%,#efe9df 50%);color:#fff}
/* 5. água */
.lbrn .ag-nivel{transform:translateY(102px);transition:transform 2s cubic-bezier(.3,.7,.2,1) .3s}
.lbrn .ag-onda{animation:lbrnOnda 3s linear infinite;animation-play-state:paused}
.lbrn-on .ag-onda{animation-play-state:running}
@keyframes lbrnOnda{to{transform:translateX(-40px)}}
.lbrn .ag-b{opacity:0}
.lbrn-on .ag-b{animation:lbrnBolha 2.6s ease-in infinite}
.lbrn-on .ag-b2{animation-delay:.9s}.lbrn-on .ag-b3{animation-delay:1.7s}
@keyframes lbrnBolha{0%{opacity:0;transform:translateY(0)}20%{opacity:.9}100%{opacity:0;transform:translateY(-34px)}}
/* 6. vidro */
.lbrn .vd-ponta{transform:translate(18px,30px);opacity:0}
.lbrn-on .vd-ponta{animation:lbrnRisca 2.6s ease-in-out .6s infinite}
@keyframes lbrnRisca{0%{transform:translate(18px,30px);opacity:0}10%{opacity:1}55%{transform:translate(100px,88px);opacity:1}65%,100%{transform:translate(100px,88px);opacity:0}}
.lbrn .vd-br{opacity:0;transform-origin:center;transform-box:fill-box}
.lbrn-on .vd-br{animation:lbrnBrilho 2.6s ease .6s infinite}
.lbrn-on .vd-br2{animation-delay:1s}.lbrn-on .vd-br3{animation-delay:1.4s}
@keyframes lbrnBrilho{0%,20%{opacity:0;transform:scale(.3)}35%{opacity:1;transform:scale(1)}55%,100%{opacity:0;transform:scale(.3)}}
.lbrn .vd-risco{stroke-dasharray:110;stroke-dashoffset:110}
.lbrn-on .vd-risco{animation:lbrnRiscoM 2.6s ease-in-out .6s infinite}
@keyframes lbrnRiscoM{0%{stroke-dashoffset:110;opacity:.9}55%{stroke-dashoffset:0;opacity:.9}100%{stroke-dashoffset:0;opacity:.35}}
.lbrn-mohs{display:flex;gap:2px;margin:9px 6px 2px}
.lbrn-mohs i{flex:1;height:6px;border-radius:2px;background:#eae3d7;transition:background .25s}
.lbrn-mohs i.ok{background:var(--o)}
.lbrn-mohs i.dia{background:repeating-linear-gradient(45deg,#d9d1c4 0 2px,#eae3d7 2px 4px)}
/* 7. peso */
.lbrn .ps-pt{transform-origin:60px 74px;transform:rotate(-80deg);transition:transform 1.6s cubic-bezier(.3,1.4,.4,1) .5s}
/* 8. luz */
.lbrn-lz{transition:background .6s}
.lbrn .lz-fundo{fill:#fff;transition:fill .7s}
.lbrn .lz-lu{fill:#e9e2d6;stroke:var(--i);stroke-width:.8;transition:fill .7s,stroke .7s,filter .7s}
.lbrn .lz-aro{fill:none;stroke:var(--i);stroke-width:2;transition:stroke .7s}
.lbrn-lz.noite{background:#0d1014;border-color:#0d1014}
.lbrn-lz.noite .lbrn-n,.lbrn-lz.noite .lbrn-l{color:#e8f7ee}
.lbrn-lz.noite .lbrn-x{color:#9fb3a8}
.lbrn-lz.noite .lz-fundo{fill:#0d1014}
.lbrn-lz.noite .lz-aro{stroke:#2a3138}
.lbrn-lz.noite .lz-lu{fill:#b9ffd4;stroke:#b9ffd4;filter:drop-shadow(0 0 3px #6dffa8)}
/* 9. movimento à mostra */
.lbrn .mv-rotor{transform-origin:60px 60px}
.lbrn-on .mv-rotor{animation:lbrnRotor 4.5s cubic-bezier(.45,0,.3,1) infinite}
@keyframes lbrnRotor{0%{transform:rotate(-40deg)}35%{transform:rotate(250deg)}55%{transform:rotate(190deg)}100%{transform:rotate(320deg)}}
.lbrn .mv-bal{transform-origin:78px 44px}
.lbrn-on .mv-bal{animation:lbrnBal var(--bt,.1667s) ease-in-out infinite alternate}
/* 10. cronógrafo e GMT */
.lbrn .cr-pt{transform-origin:60px 62px;transition:transform .15s}
.lbrn-cr-v{font-variant-numeric:tabular-nums;display:inline-block;min-width:2.2em}
.lbrn .gm-24{transform-origin:60px 60px}
.lbrn-on .gm-24{animation:lbrnGira 12s linear infinite}
.lbrn .gm-h{transform-origin:60px 60px}
.lbrn-on .gm-h{animation:lbrnGira 6s linear infinite}
/* pulso */
.lbrn-pul{margin:16px 0 0;background:#fff;border:1px solid var(--l);border-radius:16px;padding:16px;display:grid;grid-template-columns:1fr;gap:6px;text-align:center}
@media (min-width:768px){.lbrn-pul{grid-template-columns:300px 1fr;text-align:left;align-items:center;gap:22px;padding:18px 24px}}
.lbrn-pul h3{font:500 22px/1.15 "Cormorant Garamond",Georgia,serif;color:var(--i);margin:0 0 4px}
.lbrn-pul p{font-size:12.5px;color:var(--m);margin:0}
.lbrn-pul svg{width:100%;max-width:300px;height:auto;display:block;margin:0 auto}
.lbrn-pul input[type=range]{width:100%;accent-color:#8F6E2E;margin:12px 0 4px}
.lbrn-pv{font:600 13px/1.35 Jost,Arial,sans-serif;color:var(--i);margin-top:6px}
.lbrn-pv span{display:block;font-weight:400;color:var(--m);font-size:12px;margin-top:3px}
.lbrn-pm{font:500 26px/1 "Cormorant Garamond",Georgia,serif;color:var(--o)}
.lbrn-nota{font-size:10.5px;color:#a39a8e;text-align:center;margin:10px 0 0}
/* pulseira ajustada (simulador) */
.lbrn-aj{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--c);border:1px dashed var(--o2);text-align:left;font-size:12.5px;line-height:1.4;color:var(--t)}
.lbrn-aj span{flex:1;min-width:0}
.lbrn-aj a{flex:none;font:600 11px/1 Jost,Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;background:var(--i);color:#fff!important;text-decoration:none!important;border-radius:99px;padding:10px 12px}
/* guia rápido */
.lbrg{margin:14px 0 0;display:grid;gap:8px;text-align:left}
.lbrg details{background:#fff;border:1px solid var(--l);border-radius:14px;padding:0 16px}
.lbrg summary{list-style:none;cursor:pointer;padding:14px 0;font:600 14px/1.3 Jost,Arial,sans-serif;color:var(--i);display:flex;align-items:center;gap:10px;-webkit-tap-highlight-color:transparent}
.lbrg summary::-webkit-details-marker{display:none}
.lbrg summary:after{content:"";flex:none;margin:-4px 2px 0 auto;width:8px;height:8px;border-right:1.5px solid var(--o);border-bottom:1.5px solid var(--o);transform:rotate(45deg);transition:transform .2s}
.lbrg details[open] summary:after{transform:rotate(-135deg);margin-top:4px}
.lbrg ul{margin:0 0 14px!important;padding:0 0 0 18px!important;font-size:13px;line-height:1.5;color:var(--t)}
.lbrg li{margin:0 0 6px!important;list-style:disc!important}
.lbrg table{width:100%;border-collapse:collapse;font-size:12.5px;margin:0 0 12px}
.lbrg td{padding:7px 6px;border-top:1px solid #f0ebe2;vertical-align:top;color:var(--t)}
.lbrg td:first-child{font-weight:600;white-space:nowrap;color:var(--i)}
.lbrg tr.eu td{background:var(--c)}
.lbrg tr.eu td:first-child{color:var(--o)}
.lbrg tr.eu td:last-child:after{content:" ← este relógio";color:var(--o);font-weight:600;font-size:11px}
/* chips perto do preço */
.lbr-top{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 6px;font-family:Jost,Arial,sans-serif}
.lbr-top span,.lbr-top a{font:500 12px/1 Jost,Arial,sans-serif;padding:7px 10px;border:1px solid #ECE5DA;border-radius:99px;background:#FAF7F2;color:#403A34;white-space:nowrap;text-decoration:none!important}
.lbr-top span b{color:#8F6E2E;font-weight:600}
.lbr-top a{background:#fff;border-color:#C9A55C;color:#8F6E2E!important;font-weight:600}
/* na sua compra */
.lbr-vem{margin:14px 0 6px;border:1px solid #ECE5DA;border-radius:14px;background:#FAF7F2;padding:14px 14px 13px;font-family:Jost,Arial,sans-serif;text-align:left}
.lbr-vem .lbrn-k{margin:0 0 9px}
.lbr-vem ul{list-style:none!important;margin:0!important;padding:0!important;display:grid;grid-template-columns:1fr 1fr;gap:9px 12px}
.lbr-vem li{display:flex;align-items:center;gap:8px;font-size:12.5px;line-height:1.3;color:#403A34;margin:0!important;padding:0!important;list-style:none!important}
.lbr-vem li:before{display:none!important}
.lbr-vem svg{flex:none;width:20px;height:20px;stroke:#8F6E2E;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.lbr-vem .lbrn-k,.lbrc .lbrn-k{font:600 10.5px/1.2 Jost,Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#8F6E2E}
/* encomendar */
.lbr-enc{display:block;margin:4px 0 14px;padding:14px;border-radius:12px;background:#0A0A0B;color:#fff!important;text-align:center;font:600 15px/1.2 Jost,Arial,sans-serif;text-decoration:none!important}
.lbr-enc small{display:block;font:400 12px/1.35 Jost,Arial,sans-serif;color:#d9d1c4;margin-top:5px}
/* etiqueta nos cartões */
.lbrl{font:600 10px/1.3 Jost,Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#8F6E2E;margin:0 0 4px}
/* mesma proposta */
.lbrc{margin:0 0 28px;font-family:Jost,Arial,sans-serif;color:#403A34}
.lbrc-cab{display:flex;align-items:flex-end;gap:12px;margin:0 0 12px}
.lbrc-cab>div{flex:1;min-width:0}
.lbrc h2{font:500 26px/1.1 "Cormorant Garamond",Georgia,serif;color:#0A0A0B;margin:4px 0 2px}
.lbrc h2 em{color:#8F6E2E}
.lbrc-cab p{font-size:12.5px;color:#776E64;margin:0}
.lbrc-cmp{flex:none;font:600 10.5px/1 Jost,Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;background:#0A0A0B;color:#fff;border:0;border-radius:99px;padding:11px 14px;cursor:pointer}
.lbrc-row{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.lbrc-row::-webkit-scrollbar{display:none}
.lbrc-c{flex:0 0 200px;scroll-snap-align:start;background:#fff;border:1px solid #ECE5DA;border-radius:16px;padding:10px 12px 12px;display:flex;flex-direction:column}
.lbrc-c img{width:100%;aspect-ratio:1/1;object-fit:contain;display:block}
.lbrc-n{font:500 15px/1.25 "Cormorant Garamond",Georgia,serif;color:#0A0A0B!important;text-decoration:none!important;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em;margin:6px 0 4px}
.lbrc-e{font:600 9.5px/1.3 Jost,Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#8F6E2E;margin-bottom:6px}
.lbrc-p{font:600 15px/1.2 Jost,Arial,sans-serif;color:#0A0A0B;margin-top:auto}
.lbrc-p small{display:block;font:500 11.5px/1.3 Jost,Arial,sans-serif;color:#2f7d4f}
.lbrc-b{margin-top:8px;font:600 10px/1 Jost,Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;background:none;border:1px solid #0A0A0B;border-radius:99px;padding:8px 0;color:#0A0A0B;cursor:pointer}
@media (max-width:767px){.lbrc-cab{flex-direction:column;align-items:flex-start}.lbrc-row{margin:0 -16px;padding:2px 16px 8px;scroll-padding:0 16px}.lbrc-c{flex-basis:44%}}
/* comparador */
.lbrx{position:fixed;top:0;right:0;bottom:0;left:0;z-index:2147483000;background:rgba(10,10,11,.45);display:flex;align-items:flex-end;justify-content:center;font-family:Jost,Arial,sans-serif;opacity:0;transition:opacity .2s}
.lbrx.on{opacity:1}
.lbrx-p{background:#fff;width:100%;max-width:820px;max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-radius:20px 20px 0 0;padding:0 0 22px;transform:translateY(30px);transition:transform .25s}
.lbrx.on .lbrx-p{transform:none}
@media (min-width:768px){.lbrx{align-items:center}.lbrx-p{border-radius:20px;max-height:88vh}}
.lbrx-cab{position:sticky;top:0;background:#fff;display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #ECE5DA;z-index:2}
.lbrx-cab h3{font:500 22px/1.1 "Cormorant Garamond",Georgia,serif;margin:0;flex:1;color:#0A0A0B}
.lbrx-x{width:38px;height:38px;border-radius:50%;border:1px solid #ECE5DA;background:#fff;font:400 22px/1 Jost,Arial,sans-serif;cursor:pointer;color:#0A0A0B;padding:0}
.lbrx-g{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:0 10px;padding:12px 14px 0}
.lbrx-h{text-align:center;font-size:12px;display:flex;flex-direction:column;align-items:center}
.lbrx-h img{width:100%;max-width:120px;aspect-ratio:1/1;object-fit:contain;display:block;margin:0 auto 4px}
.lbrx-h a{color:#0A0A0B!important;text-decoration:none!important;font:500 14px/1.2 "Cormorant Garamond",Georgia,serif;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:3.6em}
.lbrx-h b{display:block;font:600 13px/1.2 Jost,Arial,sans-serif;color:#0A0A0B;margin-top:4px}
.lbrx-h i{font:600 9px/1.2 Jost,Arial,sans-serif;font-style:normal;letter-spacing:.14em;text-transform:uppercase;color:#8F6E2E;margin-bottom:4px;min-height:11px}
.lbrx-l{grid-column:1/-1;font:600 9.5px/1.2 Jost,Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#776E64;text-align:center;padding:11px 0 5px;border-top:1px solid #f0ebe2;margin-top:10px}
.lbrx-v{text-align:center;font-size:13px;color:#403A34;line-height:1.3}
.lbrx-v.top{color:#8F6E2E;font-weight:600}
