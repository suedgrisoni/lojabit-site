<script>/* LOJABIT - SEO: meta description das páginas de conteúdo (/pagina/...), que o painel não deixa preencher. Para incluir uma página nova, acrescente uma linha "endereco": "descrição" na lista abaixo. */(function(){"use strict";
var D={
"loja-de-perfumes-em-volta-redonda":"Loja física da @LOJABIT no Aterrado Center Shopping, em Volta Redonda (RJ): perfumes árabes, de nicho e importados originais. Endereço, horário e retirada.",
"sobre-nos":"Conheça a @LOJABIT: perfumaria familiar e independente de Volta Redonda (RJ), criada em 2014 por Nevander e Carla. Nossa história e o que nos guia.",
"e-seguro-comprar-na-lojabit":"É seguro comprar na @LOJABIT? Loja física em Volta Redonda desde 2015, nota 4,9 no Google, só produtos originais, pagamento protegido e troca garantida.",
"fast-delivery":"Entrega da @LOJABIT: pago até 13h em dia útil, enviamos no mesmo dia. Correios, transportadoras, motoboy em Volta Redonda e região ou retirada na loja.",
"trocas-devolucoes-e-garantia":"Trocas e garantia na @LOJABIT: até 30 dias para devolver sem custo, decant grátis para testar antes de abrir o lacre e garantia contra defeito.",
"politica-de-privacidade":"Como a @LOJABIT usa e protege seus dados pessoais, em linguagem simples e conforme a LGPD: o que coletamos, para quê e como pedir acesso ou exclusão.",
"politica-de-seguranca":"Compre com segurança na @LOJABIT: site com SSL, pagamento por intermediários especializados, nossos canais oficiais e como evitar golpes com Pix.",
"perfumes-em-barra-mansa":"Perfumes árabes, de nicho e importados originais com entrega por motoboy em Barra Mansa em 1 dia útil: R$ 20, grátis acima de R$ 200. Ou retire na loja.",
"perfumes-em-resende":"Perfumes originais com entrega por motoboy em Resende em 1 dia útil: R$ 30, grátis acima de R$ 200. Árabes, nicho e importados da @LOJABIT."
};
/* 12/11/2026: páginas de marca (/marca/...) sem descrição no painel e páginas de busca ganham descrição automática.
   O texto depende do que a página mostra: perfumes (decants e frascos), relógios ou outros produtos. */
function meta(txt){var t=document.querySelector('meta[name="description"]');if(t&&t.getAttribute("content"))return;if(!t){t=document.createElement("meta");t.setAttribute("name","description");(document.head||document.documentElement).appendChild(t)}t.setAttribute("content",txt)}
function auto(){var p=location.pathname,mm=p.match(/^\/marca\/[\w-]+\.html$/),bb=/^\/buscar/.test(p);if(!mm&&!bb)return;
var nomes=[].map.call(document.querySelectorAll(".listagem-item .nome-produto"),function(e){return e.textContent.trim()}),perf=nomes.filter(function(n){return/^(Perfume|Decant|Kit Perfume)/i.test(n)}).length,rel=nomes.filter(function(n){return/^Rel[óo]gio/i.test(n)}).length;
if(mm){var marca=(document.title||"").split(" - ")[0].trim();if(!marca||/@LOJABIT/i.test(marca))return;
meta(perf>=rel&&perf?marca+" original na @LOJABIT: perfumes em decants de 5, 10 e 30 ml e frascos lacrados, 10% off no Pix e envio para todo o Brasil. Loja familiar em Volta Redonda (RJ) desde 2014."
:rel?"Relógios "+marca+" originais na @LOJABIT, com envio para todo o Brasil e retirada na loja em Volta Redonda (RJ). Loja familiar no mesmo endereço desde 2014."
:marca+" original na @LOJABIT, à pronta entrega, com envio para todo o Brasil e retirada na loja em Volta Redonda (RJ). Loja familiar desde 2014.");return}
var q=(new URLSearchParams(location.search).get("q")||"").trim().slice(0,60);
meta((q?"Resultados para “"+q+"” na @LOJABIT: ":"Busca na @LOJABIT: ")+"perfumes árabes, de nicho e importados originais, decants de 5, 10 e 30 ml e frascos lacrados, com 10% off no Pix.")}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",auto);else auto();
var m=location.pathname.match(/^\/pagina\/([\w-]+)\.html$/);if(!m||!D[m[1]])return;
var t=document.querySelector('meta[name="description"]');
if(!t){t=document.createElement("meta");t.setAttribute("name","description");(document.head||document.documentElement).appendChild(t)}
t.setAttribute("content",D[m[1]]);
})();</script>
