<script>/* LOJABIT - visual novo 16: Departamentos novo. Lê as categorias e marcas do próprio menu da loja (o que mudar no painel aparece aqui sozinho) e monta um painel em duas colunas + famílias e ocasiões. Só roda quando o "Visual novo 15" liga a classe lbdep. */
(function(){"use strict";
var de=document.documentElement;
if(!window.__lbOn||window.__lbDep||!/\blbdep\b/.test(de.className))return;
window.__lbDep=1;
var ORDEM=["doces","com-oud","amadeirados","de-baunilha","florais","frescos-e-citricos","marcantes","para-o-dia-a-dia","para-a-noite","versateis"];
function esc(t){return String(t).replace(/[&<>"']/g,function(a){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[a]})}
function txt(a){return a?a.textContent.replace(/\s+/g," ").trim():""}
function sem(s){return s.normalize?s.normalize("NFD").replace(/[̀-ͯ]/g,""):s}
function dados(){var card=document.querySelector(".main-menu-desktop li.all-categories > ul.card")||document.querySelector(".main-menu-mobile ul.primary-menu");if(!card)return null;
var cats=[];for(var k=0;k<card.children.length;k++){var li=card.children[k],a=li.querySelector(":scope > a");if(!a)continue;var subs=[];for(var s=li.querySelectorAll(":scope > ul > li > a"),j=0;j<s.length;j++)subs.push({n:txt(s[j]),h:s[j].getAttribute("href")});cats.push({n:txt(a),h:a.getAttribute("href"),subs:subs})}
var dec={};cats.forEach(function(c){if(/^decants$/i.test(c.n))c.subs.forEach(function(s){var m=s.n.replace(/^decants\s+de\s+/i,"").toLowerCase();dec[m]=s.h})});
var fam=[],vistos={};for(var f=document.querySelectorAll('a[href*="/perfumes-"]'),i=0;i<f.length;i++){var h=f[i].getAttribute("href")||"",sl=(h.match(/\/perfumes-([a-z-]+)$/)||[])[1];if(sl&&ORDEM.indexOf(sl)>-1&&!vistos[sl]){vistos[sl]=1;fam.push({n:txt(f[i]).replace(/^Perfumes\s+(com\s+|de\s+|para\s+[oa]\s+)?/i,""),h:h,o:ORDEM.indexOf(sl)})}}
fam.sort(function(a,b){return a.o-b.o});
var of=document.querySelector('.main-menu-desktop a[href$="/ofertas"]');
return{cats:cats,dec:dec,fam:fam,ofertas:of?of.getAttribute("href"):"/ofertas"}}
var SETA='<svg class="lbd-seta" viewBox="0 0 12 12" aria-hidden="true"><path d="M4 2l4 4-4 4"/></svg>';
function conta(c){if(!c.subs.length)return"";if(/^decants$/i.test(c.n))return c.subs.length+" tipos";return c.subs.length+(c.subs.length>1?" marcas":" marca")}
function marcas(c){var l=c.subs.slice().sort(function(a,b){return a.n.localeCompare(b.n,"pt")});if(l.length<=8)return'<div class="lbd-marcas"><div class="lbd-grupo">'+l.map(function(s){return'<a href="'+esc(s.h)+'">'+esc(s.n)+"</a>"}).join("")+"</div></div>";var g={},ord=[];l.forEach(function(s){var L=sem(s.n.charAt(0).toUpperCase());if(!/[A-Z]/.test(L))L="#";if(!g[L]){g[L]=[];ord.push(L)}g[L].push(s)});return'<div class="lbd-marcas">'+ord.map(function(L){return'<div class="lbd-grupo"><b>'+L+"</b>"+g[L].map(function(s){return'<a href="'+esc(s.h)+'">'+esc(s.n)+"</a>"}).join("")+"</div>"}).join("")+"</div>"}
function aba(c,i,d){var dh=d.dec[c.n.toLowerCase()];return'<div class="lbd-aba" data-i="'+i+'"><div class="lbd-topo"><div><span class="lbd-kick">'+(conta(c)||"Departamento")+'</span><span class="lbd-tit">'+esc(c.n)+'</span></div><div class="lbd-acoes"><a class="lbd-btn" href="'+esc(c.h)+'">Ver todos</a>'+(dh?'<a class="lbd-btn lbd-btn2" href="'+esc(dh)+'">Decants de 5, 10 e 30 ml</a>':"")+"</div></div>"+(c.subs.length?marcas(c):'<p class="lbd-vazio">Todos os '+esc(c.n.toLowerCase())+' da loja reunidos em uma página.</p>')+"</div>"}
function painel(d){return'<div class="lbd" role="region" aria-label="Departamentos"><div class="lbd-corpo"><ul class="lbd-cats">'+d.cats.map(function(c,i){return'<li><a class="lbd-cat" href="'+esc(c.h)+'" data-i="'+i+'"><span>'+esc(c.n)+"</span><small>"+conta(c)+"</small>"+SETA+"</a></li>"}).join("")+'<li><a class="lbd-cat lbd-oferta" href="'+esc(d.ofertas)+'"><span>Ofertas e promoções</span>'+SETA+"</a></li></ul>"+'<div class="lbd-painel">'+d.cats.map(function(c,i){return aba(c,i,d)}).join("")+"</div></div>"+(d.fam.length?'<div class="lbd-fam"><span>Encontre seu perfume</span>'+d.fam.map(function(f){return'<a href="'+esc(f.h)+'">'+esc(f.n)+"</a>"}).join("")+"</div>":"")+"</div>"}
var toque=false;document.addEventListener("pointerdown",function(e){toque=e.pointerType==="touch"},true);
function computador(d){var li=document.querySelector(".main-menu-desktop li.all-categories");if(!li||li.classList.contains("lbd-on"))return;var trig=li.querySelector(":scope > a");li.insertAdjacentHTML("beforeend",painel(d));li.classList.add("lbd-on");var p=li.querySelector(".lbd"),t=0,at=-1;
function ativar(i){if(i===at)return;at=i;for(var c=p.querySelectorAll(".lbd-cat[data-i]"),k=0;k<c.length;k++)c[k].classList.toggle("lbd-ativo",+c[k].getAttribute("data-i")===i);for(var b=p.querySelectorAll(".lbd-aba"),j=0;j<b.length;j++)b[j].classList.toggle("lbd-ativo",+b[j].getAttribute("data-i")===i)}
function fundo(){var f=document.getElementById("lbd-fundo");if(!f){f=document.createElement("div");f.id="lbd-fundo";f.addEventListener("click",function(){fechar()});document.body.appendChild(f)}return f}
window.__lbdFechar=function(){if(li.classList.contains("lbd-aberto"))fechar()};function abrir(){window.__lbmFechar&&window.__lbmFechar();if(at<0)ativar(0);li.classList.add("lbd-aberto");fundo().classList.add("lbd-on");trig&&trig.setAttribute("aria-expanded","true")}
function fechar(){li.classList.remove("lbd-aberto","open");fundo().classList.remove("lbd-on");trig&&trig.setAttribute("aria-expanded","false")}
ativar(0);if(trig){trig.setAttribute("aria-expanded","false");trig.setAttribute("aria-haspopup","true");trig.setAttribute("title","Clique para ver todos os departamentos")}
trig&&trig.addEventListener("click",function(e){e.preventDefault();e.stopPropagation();clearTimeout(t);li.classList.contains("lbd-aberto")?fechar():abrir()},true);
var tc=0;p.addEventListener("mouseover",function(e){var a=e.target.closest&&e.target.closest(".lbd-cat[data-i]");if(!a)return;clearTimeout(tc);var i=+a.getAttribute("data-i");tc=setTimeout(function(){ativar(i)},60)});
p.addEventListener("focusin",function(e){var a=e.target.closest&&e.target.closest(".lbd-cat[data-i]");a&&ativar(+a.getAttribute("data-i"))});
p.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest(".lbd-cat[data-i]");if(a&&toque){var i=+a.getAttribute("data-i");if(i!==at){e.preventDefault();ativar(i)}}});
document.addEventListener("click",function(e){if(!li.contains(e.target))fechar()});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&li.classList.contains("lbd-aberto")){fechar();trig&&trig.focus()}})}
function celular(d){var ul=document.querySelector(".main-menu-mobile ul.primary-menu");if(!ul||ul.classList.contains("lbm-on"))return;ul.classList.add("lbm-on");for(var k=0;k<ul.children.length;k++){var li=ul.children[k],a=li.querySelector(":scope > a"),sub=li.querySelector(":scope > ul");if(a&&sub)sub.insertAdjacentHTML("afterbegin",'<li class="lbm-todos"><a href="'+esc(a.getAttribute("href"))+'">Ver tudo em '+esc(txt(a))+"</a></li>")}
ul.insertAdjacentHTML("afterend",'<div class="lbm-extra">'+(d.fam.length?'<h4>Encontre seu perfume</h4><div class="lbm-chips">'+d.fam.map(function(f){return'<a href="'+esc(f.h)+'">'+esc(f.n)+"</a>"}).join("")+"</div>":"")+'<a class="lbm-oferta" href="'+esc(d.ofertas)+'">Ofertas e promoções</a></div>')}

/* todos os menus da barra e do topo abrem só no clique (delegado: funciona mesmo se o tema montar o menu depois) */
var SEL_BAR=".main-menu-desktop .nivel-um > li:not(.all-categories) > a",SEL_TOPO="#cabecalho .col-icons .menu-dropdown > a, #cabecalho .col-icons .account-info > span";
function prepara(li){var a=li.querySelector(":scope > a"),c=li.querySelector(":scope > ul");if(!a||!c)return;li.classList.add("menu-dropdown");c.classList.add("card","card-menu");if(!c.querySelector(".lbm-ver"))c.insertAdjacentHTML("afterbegin",'<li class="lbm-ver"><a href="'+esc(a.getAttribute("href"))+'">Ver todos · '+esc(txt(a))+"</a></li>");if(!a.getAttribute("aria-haspopup")){a.setAttribute("aria-haspopup","true");a.setAttribute("aria-expanded","false");a.setAttribute("title","Clique para ver as marcas de "+txt(a))}}
function preparaTodos(){[].forEach.call(document.querySelectorAll(".main-menu-desktop .nivel-um > li:not(.all-categories)"),prepara)}
function itemDe(el){if(!el||!el.closest)return null;var g=el.closest(SEL_BAR),topo=false;if(!g){g=el.closest(SEL_TOPO);topo=!!g}if(!g)return null;var li=g.parentElement;if(!topo)prepara(li);var c=li.querySelector(topo?":scope > .card-menu":":scope > ul");return c?{li:li,gat:g,c:c,topo:topo}:null}
var aberto=null,PROPS=["visibility","opacity","transform","pointer-events"],VAL=["visible","1","none","auto"];
function mostra(it,s){PROPS.forEach(function(p,k){s?it.c.style.setProperty(p,VAL[k],"important"):it.c.style.removeProperty(p)});if(!s){it.c.style.removeProperty("left");it.c.style.removeProperty("right")}}
function alinhar(it){var p=it.c.offsetParent||document.body,pr=p.getBoundingClientRect(),lr=it.li.getBoundingClientRect(),w=it.c.offsetWidth,vw=document.documentElement.clientWidth,l=lr.left;if(l+w>vw-16)l=Math.max(16,lr.right-w);it.c.style.setProperty("left",Math.round(l-pr.left)+"px","important");it.c.style.setProperty("right","auto","important");it.c.style.setProperty("transform-origin",Math.round(lr.left+lr.width/2-l)+"px 0","important")}
function fecharTodos(){if(aberto){aberto.li.classList.remove("lbm-aberto","open");mostra(aberto,0);aberto.gat.setAttribute("aria-expanded","false");aberto=null}var f=document.getElementById("lbd-fundo");if(f&&!document.querySelector(".lbd-aberto"))f.classList.remove("lbd-on")}
window.__lbmFechar=fecharTodos;
function abreMenu(it){aberto=it;it.li.classList.add("lbm-aberto");mostra(it,1);it.gat.setAttribute("aria-expanded","true");try{window.__lbmAoAbrir&&window.__lbmAoAbrir(it)}catch(e){}if(!it.topo){var f=document.getElementById("lbd-fundo");if(!f){f=document.createElement("div");f.id="lbd-fundo";document.body.appendChild(f)}f.onclick=function(){fecharTodos();window.__lbdFechar&&window.__lbdFechar()};f.classList.add("lbd-on");alinhar(it)}}
function menus(){if(window.__lbmOn)return;window.__lbmOn=1;
document.addEventListener("click",function(e){var it=itemDe(e.target);if(it){e.preventDefault();e.stopPropagation();var mesmo=aberto&&aberto.li===it.li;window.__lbdFechar&&window.__lbdFechar();fecharTodos();if(!mesmo)abreMenu(it);return}if(aberto&&!(e.target.closest&&e.target.closest(".lbm-aberto")))fecharTodos()},true);
document.addEventListener("keydown",function(e){if(e.key==="Escape")fecharTodos()})}
function rolagem(){var cab=document.getElementById("cabecalho");if(!cab||window.__lbdRol)return;window.__lbdRol=1;var mede=function(){de.style.setProperty("--lbh",cab.offsetHeight+"px")};mede();if(window.ResizeObserver)new ResizeObserver(mede).observe(cab);window.addEventListener("resize",mede);var rolou=false;window.addEventListener("scroll",function(){var r=(window.pageYOffset||0)>40;if(r!==rolou){rolou=r;de.classList.toggle("lbh-rolou",r)}mede()},{passive:true})}
function tudo(){try{rolagem()}catch(e){}try{menus();preparaTodos()}catch(e){}var d;try{d=dados()}catch(e){}if(!d||!d.cats.length)return;try{computador(d)}catch(e){}try{celular(d)}catch(e){}}
tudo();document.readyState==="loading"&&document.addEventListener("DOMContentLoaded",tudo);window.addEventListener("load",function(){tudo();setTimeout(tudo,1500)});
})();</script>
