<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../relogios_video/fontes/fontes.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#FAF7F2}
#c{position:relative;width:1200px;height:630px;overflow:hidden;font-family:Jost,Arial,sans-serif;color:#0A0A0B;
  background:radial-gradient(ellipse 62% 78% at 50% 46%,#FFFFFF 0%,#FBF8F3 52%,#EFE6D7 100%)}
.moldura{position:absolute;inset:18px;border:1px solid rgba(201,165,92,.55);border-radius:2px;pointer-events:none}
.foto{position:absolute;mix-blend-mode:multiply}
#perfume{left:-46px;top:40px;width:430px;height:560px;background:url(naxos.jpg) 50% 52%/560px no-repeat}
#relogio{right:-62px;top:58px;width:450px;height:520px;background:url(seiko.jpg) 50% 50%/560px no-repeat}
.centro{position:absolute;left:285px;width:630px;top:0;height:630px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.k{font:600 15px/1 Jost,Arial,sans-serif;letter-spacing:.34em;text-transform:uppercase;color:#8F6E2E;margin-bottom:26px}
.logo{width:500px;height:auto;display:block}
.fio{width:72px;height:2px;background:#C9A55C;margin:26px 0 22px}
.t{font:500 44px/1.12 "Cormorant Garamond",Georgia,serif;letter-spacing:-.005em}
.t em{font-style:italic;color:#8F6E2E}
.l{margin-top:22px;font:500 15px/1 Jost,Arial,sans-serif;letter-spacing:.26em;text-transform:uppercase;color:#403A34}
.l b{color:#8F6E2E;font-weight:600;padding:0 6px}
</style></head><body>
<div id="c">
  <div class="foto" id="perfume"></div>
  <div class="foto" id="relogio"></div>
  <div class="moldura"></div>
  <div class="centro">
    <div class="k">Perfumes &amp; relógios originais</div>
    <img class="logo" src="logo.png" alt="">
    <div class="fio"></div>
    <div class="t">Árabes, de nicho e importados<br><em>em frasco ou decant</em></div>
    <div class="l">Volta Redonda <b>·</b> desde 2014 <b>·</b> lojabit.com</div>
  </div>
</div>
</body></html>
